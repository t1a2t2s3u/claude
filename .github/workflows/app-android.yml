# Sonae のアプリ版（Android）をビルドして APK を成果物として残す。
# このリポジトリの開発コンテナには Android SDK が入らない（配布元が
# ネットワークで遮断されている）ため、ビルドはここで行う。
name: Build Android app

on:
  push:
    branches: [claude/monthly-payment-overview-xr06td]
    paths:
      - 'index.html'
      - 'release/**'
      - 'app/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 税計算のテスト（本体が壊れていないか）
        run: node test/tax.test.mjs

      - name: 依存を入れる
        working-directory: app
        run: npm ci

      - name: www/ を組み立てて Android に同期
        working-directory: app
        run: |
          npm run build
          npx cap sync android

      - name: APK をビルド
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sonae-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Google Play は AAB しか受け付けない。署名鍵が登録されるまでは飛ばす。
      # 鍵は ANDROID_KEYSTORE_BASE64 などのシークレットに入れる（下の README 参照）。
      - name: 署名鍵があるか
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "署名鍵が未登録のため、リリース用 AAB は作りません。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 鍵を取り出す
        if: steps.keystore.outputs.ready == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: リリース用 AAB をビルド
        if: steps.keystore.outputs.ready == 'true'
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.ready == 'true'
        with:
          name: sonae-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
