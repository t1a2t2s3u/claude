# デフォルトブランチが更新されるたびに、内容を gh-pages ブランチへ同期して
# GitHub Pages(公開元: gh-pages)を更新する。
# ※ Actionsトークンでは Pages サイトの新規作成ができないため、
#    artifact方式(actions/deploy-pages)ではなくブランチ同期方式を使う。
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/claude-md-docs-mw8cwr] # このリポジトリのデフォルトブランチ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push current contents to gh-pages
        run: git push --force origin HEAD:gh-pages
