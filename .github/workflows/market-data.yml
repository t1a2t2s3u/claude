# シミュレータ用の市場データ(銘柄マスタ・財務データ)を毎朝自動更新し、
# simulator/autodata/ にコミットする。Streamlit Cloudはプッシュで自動再デプロイ
# されるため、アプリ側の手動更新は不要になる。
# 注意: scheduleはデフォルトブランチ上のワークフローにのみ作用する。
name: 市場データ自動更新

on:
  schedule:
    # 平日 JST 6:30 = UTC 21:30(日〜木): 東証プライム(約35分)
    - cron: '30 21 * * 0-4'
    # 土曜 JST 5:30 = UTC 金 20:30: 東証全銘柄+米国普通株(約3時間)。
    # 財務データは四半期でしか変わらないため週1で十分、かつActions無料枠に収める
    - cron: '30 20 * * 5'
  workflow_dispatch:
    inputs:
      scope:
        description: '財務データの対象(prime/jp/us/all)'
        default: 'prime'
        required: false

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/reproduce-post-h3a7sn  # シミュレータ本体があるブランチ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存をインストール
        run: pip install -r simulator/requirements.txt
      - name: 市場データを生成
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python simulator/scripts/build_autodata.py "${{ inputs.scope || 'prime' }}"
          elif [ "${{ github.event.schedule }}" = "30 20 * * 5" ]; then
            # 土曜の週次フル更新: 東証全銘柄 → 米国普通株
            python simulator/scripts/build_autodata.py jp
            python simulator/scripts/build_autodata.py us
          else
            python simulator/scripts/build_autodata.py prime
          fi
      - name: コミットしてプッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add simulator/autodata
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m "市場データ自動更新 $(date -u +'%Y-%m-%d')"
            # 実行中(30〜70分)に他のコミットが積まれていても失敗しないようにリベースしてから押す
            git pull --rebase origin claude/reproduce-post-h3a7sn
            git push
          fi
