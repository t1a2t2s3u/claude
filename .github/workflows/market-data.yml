# シミュレータ用の市場データ(銘柄マスタ・財務データ)を毎朝自動更新し、
# simulator/autodata/ にコミットする。Streamlit Cloudはプッシュで自動再デプロイ
# されるため、アプリ側の手動更新は不要になる。
# 注意: scheduleはデフォルトブランチ上のワークフローにのみ作用する。
name: 市場データ自動更新

on:
  schedule:
    # JST 6:30(月〜金)= UTC 21:30(日〜木)
    - cron: '30 21 * * 0-4'
  workflow_dispatch:
    inputs:
      scope:
        description: '財務データの対象(prime/jp/all)'
        default: 'prime'
        required: false

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/reproduce-post-h3a7sn  # シミュレータ本体があるブランチ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存をインストール
        run: pip install -r simulator/requirements.txt
      - name: 市場データを生成
        run: python simulator/scripts/build_autodata.py "${{ inputs.scope || 'prime' }}"
      - name: コミットしてプッシュ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add simulator/autodata
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m "市場データ自動更新 $(date -u +'%Y-%m-%d')"
            git push
          fi
