      b:'世帯の所得が基準以下だと、国保の<b>均等割が7割・5割・2割</b>軽減されます。申請は不要ですが、'
        +'<b>確定申告（または住民税の申告）をしていないと判定されません</b>。'
        +'所得が少ない年こそ、申告だけは済ませておいてください。'});
  }

  /* ── 消費税 ── */
  if(pr.invoice && t.inSum>0){
    const stx = t.salesTax;
    const sc = CT_SIMPLE_MAP[pr.ctSimpleType] || CT_SIMPLE_MAP[5];
    const taxableEx = t.exEntries*pr.ctPurchasePct/100 + apportionTaxableYear(y);
    const cands = [
      {id:'simple', label:'簡易課税（'+sc.label+'）', v:Math.floor(stx*(1-sc.rate)/100)*100},
      {id:'standard', label:'本則課税', v:Math.max(0, Math.floor((stx-Math.floor(taxableEx*10/110))/100)*100)}
    ];
    if(y<=2026) cands.unshift({id:'special20', label:'2割特例', v:Math.floor(stx*0.2/100)*100});
    const best = cands.slice().sort((a,b)=>a.v-b.v)[0];
    const table = cands.map(o=>'<br>・'+o.label+'：'+yen(o.v)
      + (o.id===pr.ctMethod ? '（いま選択中）' : '')).join('');
    if(best.id!==pr.ctMethod && t.ct-best.v>=1000){
      tips.push({t:'消費税は「'+best.label+'」のほうが安くなりそう', dep:null,
        save: t.ct-best.v, hot:true,
        b:'いまの記録（売上 '+yen(t.inSum)+'・経費 '+yen(t.exEntries)+'）で3つの方式を比べると：'+table
          +'<br>ただし<b>2割特例</b>は免税事業者からインボイス登録した人が対象で、個人は2026年分まで。'
          +'<b>簡易課税</b>は基準期間の課税売上5,000万円以下＋事前の届出が必要で、いちど選ぶと2年続けます。'
          +'<b>本則課税</b>は経費のインボイスをすべて保存する必要があります。',
        when: best.id==='simple'
          ? '「消費税簡易課税制度選択届出書」を '+y+'年12月31日までに出すと '+(y+1)+'年分から'
          : null});
    }else{
      tips.push({t:'消費税の課税方式は、いまの選択でよさそう', dep:null, save:0,
        b:'いまの記録で3つの方式を比べると：'+table
          +'<br>経費が増えると本則課税が有利になることがあります。年末にもう一度見比べてください。'});
    }
    if(pr.ctMethod==='special20' && y>=2026){
      tips.push({t:'2割特例は2026年分で終わり', dep:null, save:0, hot:true,
        b:'個人事業主の<b>2割特例は2026年分（令和8年分）が最後</b>です。'
          +'2027年分からは簡易課税か本則課税を選ぶことになります。'
          +'売上に対して経費が少ない仕事なら、多くの場合は簡易課税のほうが有利です。',
        when:'簡易課税を2027年分から使うなら、2026年12月31日までに届出が必要です'});
    }
  }else if(!pr.invoice){
    if(t.inSum>10000000){
      tips.push({t:'売上1,000万円を超えると2年後から消費税', dep:null, save:0, hot:true,
        b:'記録した売上が '+yen(t.inSum)+' で、1,000万円を超えています。'
          +'この場合<b>'+(y+2)+'年から消費税の納税義務</b>が生じます。'
          +'いまのうちに簡易課税と本則課税のどちらが有利かを見ておくと、届出の期限を逃しません。'});
    }else{
      tips.push({t:'いまは消費税を納めなくてよい', dep:null, save:0,
        b:'インボイス未登録で売上が1,000万円以下なので、消費税の納税義務はありません。'
          +'登録は任意です。登録すると<b>売上の中から消費税を納める</b>ことになるので、'
          +'取引先から求められているかどうかで判断してください。'});
    }
  }

  /* ── 個人事業税 ── */
  if(t.bt>0){
    tips.push({t:'払った個人事業税は翌年の経費になる', dep:null, save:0,
      b:'個人事業税は8月と11月に納めます。<b>納めた年の必要経費</b>になるので、'
        +y+'年分として'+(y+1)+'年に払う '+yen(t.bt)+' は、'+(y+1)+'年の経費に入れてください。'
        +'なお個人事業税の計算では青色申告特別控除は使えません（利益に足し戻します）。'});
  }else if(t.profit>2400000 && pr.bizTaxRate>0){
    tips.push({t:'利益290万円を超えると個人事業税', dep:null, save:0,
      b:'個人事業税には<b>事業主控除290万円</b>があり、いまの利益 '+yen(t.profit)+' なら0円です。'
        +'あと '+yen(TAX.bizTaxExempt-t.profit)+' 増えると、超えた分に'+pr.bizTaxRate+'%かかり始めます。'});
  }

  /* ── 専従者給与 ── */
  if(pr.filing!=='white' && t.profit>3000000){
    tips.push({t:'家族に払う給与を経費にする（青色事業専従者給与）', dep:'expense', save:0,
      b:'生計を同じくする15歳以上の家族が仕事を手伝っているなら、'
        +'届け出た範囲でその給与を<b>全額経費</b>にできます。仕事の内容に見合った額であることが条件です。'
        +'ただしその家族について<b>配偶者控除・扶養控除は使えなくなる</b>ので、手取りで比べて決めてください。',
      when:'「青色事業専従者給与に関する届出書」を '+aoY+'年3月15日までに（新たに専従者を置いた場合は2ヶ月以内）'});
  }

  /* ── 赤字 ── */
  if(t.rawProfit<0){
    tips.push({t:'今年の赤字は、来年以降の税金を減らせる', dep:null, save:0, hot:true,
      b:'いまの記録は '+yen(Math.abs(t.rawProfit))+' の赤字です。'
        +(pr.filing==='white'
          ? '白色申告では赤字を繰り越せませんが、<b>青色申告なら3年間</b>繰り越して、'
            +'黒字になった年の利益から差し引けます。'
          : '青色申告なので<b>3年間繰り越して</b>、黒字になった年の利益から差し引けます。')
        +'赤字の年でも、忘れずに確定申告してください。'});
  }

  /* ── ふるさと納税 ── */
  if(t.rt>0 && t.fs.limit>0){
    const done = pr.ded.furusato;
    tips.push({t: t.fs.over ? 'ふるさと納税が上限を超えています'
        : done>0 ? 'ふるさと納税はあと'+yen(Math.max(0, t.fs.limit-done))+'まで' : 'ふるさと納税',
      dep:null, save:0, hot:t.fs.over,
      b:'税が減るわけではなく、<b>先に払って返礼品を受け取る</b>制度です。実質負担は2,000円。'
        +'いまの所得なら<b>年 '+yen(t.fs.limit)+'</b> くらいまでが目安で、'
        +(done>0 ? '<b>'+yen(done)+'</b> を寄附した記録が入っています。' : '')
        +(t.fs.over ? '超えた分は自己負担になるので、来年は目安の範囲で。' : '超えた分は自己負担になります。')
        +'個人事業主は確定申告をするので<b>ワンストップ特例は使えません</b>。申告書に寄附金控除として書きます。'
        +'上限は年末の所得で決まるので、収入を全部記録してから最後に調整するのが安全です。',
      when:'12月31日までの寄附がその年分'});
  }

  return {tips, mg};
}

/* 「目安」タブからヒントへ誘導する。効果額の一番大きいものだけ見せる */
function tipsTeaser(t, y){
  const {tips} = taxTips(t, y);
  if(!tips.length) return '';
  const top = tips.slice().sort((a,b)=>(b.save||0)-(a.save||0))[0];
  const amt = top.save>=1000 ? '<span class="tip-save">'+(top.saveWord||'年 約')+yen(Math.round(top.save/100)*100)+'</span>' : '';
  return '<section class="card panel">'
    + '<div class="panel-head"><h2>節税のヒント</h2>'
    + '<div class="actions"><button class="btn-sm" data-act="taxtab" data-tab="tips">'+tips.length+'件を見る</button></div></div>'
    + '<div class="tip hot"><div class="tip-head"><span class="tip-title">'+top.t+'</span>'+amt+'</div></div>'
    + '</section>';
}

function renderTips(t, y){
  const {tips, mg} = taxTips(t, y);
  if(!tips.length) return '';
  const per = r => yen(Math.round(10000*r/10)*10);
  let lead;
  if(mg.expense<=0 && mg.deduction<=0){
    lead = 'いまの記録では<b>所得税・住民税はかかっていません</b>。'
      + 'この状態では控除を増やすタイプの節税は効かないので、'
      + '国民年金・国保そのものを軽くする方法と、来年以降にそなえる準備が中心になります。';
  }else{
    lead = 'いまの所得だと、<b>経費を1万円増やすと約'+per(mg.expense)+'</b>、'
      + '<b>所得控除（共済・iDeCoなど）を1万円増やすと約'+per(mg.deduction)+'</b> 負担が軽くなります。'
      + (mg.nhi>0 ? '経費のほうが効くのは、所得そのものが減って<b>国民健康保険料も下がる</b>からです。' : '');
  }
  const rank = tips.map((tp,i)=>({tp, i, s: tp.save>=1000 ? tp.save : 0, h: tp.hot?1:0}))
    .sort((a,b)=> (b.s-a.s) || (b.h-a.h) || (a.i-b.i));
  const LIMIT = 4;
  const shown = view.tipsAll ? rank : rank.slice(0, LIMIT);
  const cards = shown.map(({tp})=>{
    const save = tp.save>=1000
      ? '<span class="tip-save">'+(tp.saveWord||'年 約')+yen(Math.round(tp.save/100)*100)+'</span>' : '';
    const dead = tp.dep==='deduction' && mg.deduction<=0
      ? '<div class="tip-note">※いまは所得税・住民税がかかっていないため、すぐの節税にはなりません。収入が増えた年に効きます。</div>'
      : tp.dep==='expense' && mg.expense<=0
      ? '<div class="tip-note">※いまは税負担がないため金額としての効果は出ませんが、記録しておくと収入が増えた年に効きます。</div>'
      : '';
    return '<div class="tip'+(tp.hot?' hot':'')+'">'
      + '<div class="tip-head"><span class="tip-title">'+tp.t+'</span>'+save+'</div>'
      + '<div class="tip-body">'+tp.b+'</div>'
      + dead
      + (tp.when ? '<div class="tip-when">期限・手続き：'+tp.when+'</div>' : '')
      + '</div>';
  }).join('');
  const more = rank.length>LIMIT
    ? '<button class="btn-sm" data-act="tipsall">'
      + (view.tipsAll ? '最初の'+LIMIT+'件だけ表示' : 'ほかのヒントも見る（あと'+(rank.length-LIMIT)+'件）')
      + '</button>'
    : '';
  return '<section class="card panel tips">'
    + '<h2>節税のヒント</h2>'
    + '<div class="mg-line">'+lead+'</div>'
    + cards
    + more
    + '<div class="notice" style="margin-top:14px">ここに出るのは、記録した金額から選んだ<b>一般的な情報</b>です。'
    + '使えるかどうかは事業の内容や家族の状況で変わり、制度も毎年変わります。'
    + '実際に手続きする前に、税務署・自治体・税理士にご確認ください。</div>'
    + '</section>';
}

/* 最後のバックアップから90日でそっと促す */
function backupWarn(){
  const lb = state.profile.lastBackup;
  if(!state.biz.length && !state.payments.length) return '';
  const d = lb ? -daysUntil(lb) : null;
  if(d===null) return '　<b class="warn-dot">バックアップ未実施</b>';
  if(d>=90) return '　<b class="warn-dot">バックアップから'+d+'日</b>';
  return '';
}

/* 目安タブに出す、いま効いている控除のまとめ */
function dedCard(t){
  const rows = t.ded.rows;
  const fs = t.fs || {itDed:0, rtCredit:0, limit:0, over:false};
  const head = '<div class="panel-head"><h2>所得控除</h2><div class="actions">'
    + '<button class="btn-sm" data-act="ded">入力する</button></div></div>';
  if(!rows.length && !fs.rtCredit){
    return '<section class="card panel">'+head
      + '<div class="hint">小規模企業共済・iDeCo・生命保険料・医療費・扶養家族などを入れると、'
      + 'その分だけ所得税と住民税が下がります。<b>小規模企業共済とiDeCoは掛金が全額</b>引けるので、'
      + '効き目がいちばん大きいところです。</div></section>';
  }
  const body = rows.map(r=>'<div class="trow"><span class="tlab">'+r.label
    + (r.note?'<small>'+r.note+'</small>':'')+'</span>'
    + '<span class="tval">'+yen(r.it)
    + (r.rt!==r.it ? '<small style="font-weight:400;color:var(--muted)">／住民税 '+yen(r.rt)+'</small>' : '')
    + '</span></div>').join('');
  const fsRow = fs.rtCredit>0
    ? '<div class="trow"><span class="tlab">ふるさと納税'
      + '<small>寄附 '+yen(state.profile.ded.furusato)+'　所得税は所得控除、住民税は税額控除</small></span>'
      + '<span class="tval">'+yen(fs.itDed)+'<small style="font-weight:400;color:var(--muted)">／住民税から '
      + yen(fs.rtCredit)+'</small></span></div>'
    : '';
  const fsNote = state.profile.ded.furusato>0 && fs.limit>0
    ? '<div class="notice '+(fs.over?'warn-notice':'info-notice')+'" style="margin:14px 0 0">'
      + (fs.over
        ? '<b>ふるさと納税が上限を超えています。</b>実質2,000円で収まる目安は <b>'+yen(fs.limit)+'</b> までで、'
          + '超えた分は自己負担になります。'
        : 'ふるさと納税は、いまの所得なら <b>'+yen(fs.limit)+'</b> くらいまでが目安です'
          + '（これを超えると自己負担が増えます）。')
      + '収入を全部記録してから確認してください。</div>'
    : '';
  return '<section class="card panel">'+head
    + '<div class="hint">所得税と住民税で控除額が違うものは、右側に住民税の額も出しています。</div>'
    + body + fsRow
    + '<div class="trow total"><span class="tlab">合計</span>'
    + '<span class="tval">'+yen(t.ded.it)+'<small style="font-weight:400;color:var(--muted)">／住民税 '
    + yen(t.ded.rt)+'</small></span></div>'
    + fsNote
    + '</section>';
}

function importModalHtml(){
  const st = view.imp;
  if(!st) return '';
  if(st.stage==='map'){
    const colOpt = (sel)=>st.cols.map((c,i)=>
      '<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(c||('列'+(i+1)))+'</option>').join('');
    const preview = st.rows.slice(0,3).map(r=>
      '<tr>'+r.map(v=>'<td>'+esc(String(v).slice(0,14))+'</td>').join('')+'</tr>').join('');
    return '<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="CSVの取り込み">'
      + '<h2>どの列を使うか選ぶ</h2>'
      + '<div class="hint">'+st.rows.length+'行を読み込みました。先頭の3行はこうなっています。</div>'
      + '<div style="overflow-x:auto;margin:8px 0 14px"><table class="ytable"><tbody>'+preview+'</tbody></table></div>'
      + '<form id="imp-form"><div class="f-grid">'
      + '<div><label for="i-date">日付の列</label><select id="i-date">'+colOpt(st.iDate)+'</select></div>'
      + '<div><label for="i-name">内容・摘要の列</label><select id="i-name">'+colOpt(st.iName)+'</select></div>'
      + '<div class="f-full"><label for="i-mode">金額の入り方</label><select id="i-mode">'
      + '<option value="two"'+(st.mode==='two'?' selected':'')+'>入金の列と出金の列に分かれている</option>'
      + '<option value="one"'+(st.mode==='one'?' selected':'')+'>1つの列（プラス＝入金、マイナス＝出金）</option>'
      + '<option value="ex"'+(st.mode==='ex'?' selected':'')+'>1つの列で、すべて経費（カード明細など）</option>'
      + '</select></div>'
      + '<div><label for="i-in">'+(st.mode==='two'?'入金の列':'金額の列')+'</label><select id="i-in">'+colOpt(st.iIn)+'</select></div>'
      + (st.mode==='two' ? '<div><label for="i-out">出金の列</label><select id="i-out">'+colOpt(st.iOut)+'</select></div>' : '')
      + '<div class="f-full"><label for="i-cat">経費の科目（あとで個別に直せます）</label><select id="i-cat">'
      + BIZ_EX_CATS.map(c=>'<option value="'+c.id+'"'+(st.exCat===c.id?' selected':'')+'>'+c.label+'</option>').join('')
      + '</select></div>'
      + '<div class="f-full check-line"><input type="checkbox" id="i-head"'+(st.header?' checked':'')+'>'
      + '<label for="i-head" style="margin:0">1行目は見出し（取り込まない）</label></div>'
      + '</div>'
      + '<div class="f-actions">'
      + '<button class="btn btn-primary" type="submit">この設定で読む</button>'
      + '<button class="btn btn-ghost" type="button" data-act="close">キャンセル</button>'
      + '</div></form></div></div>';
  }
  /* 確認画面 */
  const rows = st.parsed.slice(0,50).map((e,i)=>
    '<div class="item"><div class="item-main"><span class="item-name">'+esc(e.name)+'</span>'
    + '<span class="item-sub">'+e.y+'/'+e.m+'/'+e.d+'　'+(e.type==='in'?'収入':'経費')+'</span></div>'
    + '<span class="amt">'+(e.type==='in'?'＋':'−')+yen(e.amount)+'</span></div>').join('');
  const dup = st.parsed.filter(e=>e.dup).length;
  return '<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="取り込みの確認">'
    + '<h2>この内容で取り込みます</h2>'
    + '<div class="hint"><b>'+st.parsed.length+'件</b>を登録します。'
    + (st.skipped ? '読み取れなかった'+st.skipped+'行は飛ばしました。' : '')
    + (dup ? '<br><b>'+dup+'件</b>は同じ日付・金額の記録がすでにあります（重複の可能性）。' : '')+'</div>'
    + (st.parsed.length ? '<div style="max-height:40vh;overflow-y:auto;margin:10px 0">'+rows
      + (st.parsed.length>50 ? '<div class="hint">ほか'+(st.parsed.length-50)+'件</div>' : '')+'</div>' : '')
    + '<div class="f-actions">'
    + (st.parsed.length ? '<button class="btn btn-primary" type="button" data-act="impgo">取り込む</button>' : '')
    + '<button class="btn btn-ghost" type="button" data-act="close">やめる</button>'
    + '</div></div></div>';
}

/* 前に入力した取引先・内容を新しい順に集める（同じ種別のものだけ） */
function bizNameSuggestions(type){
  const seen = new Map();
  state.biz.forEach(b=>{
    if(b.type!==type || !b.name) return;
    const key = b.y*10000 + b.m*100 + b.d;
    const cur = seen.get(b.name);
    if(!cur || key>=cur.key) seen.set(b.name, {key, cat:b.cat});
  });
  return [...seen.entries()].sort((a,b)=>b[1].key-a[1].key).slice(0,40);
}

/* ファイルを1つ選ばせてテキストで読む */
function pickFile(accept, onText){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  inp.style.position = 'fixed'; inp.style.left = '-9999px';
  document.body.appendChild(inp);
  inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    const r = new FileReader();
    r.onload = ()=>{ inp.remove(); onText(String(r.result||''), f.name); };
    r.onerror = ()=>{ inp.remove(); toast('ファイルを読めませんでした'); };
    r.readAsText(f, 'utf-8');
  });
  inp.click();
}

/* ---------- 明細CSVの取り込み ---------- */
/* 引用符つきCSVを行×列に分解する（改行を含むセルにも対応） */
function parseCsv(text){
  const rows = [];
  let row = [], cell = '', q = false;
  const src = text.replace(/^\uFEFF/, '');
  for(let i=0;i<src.length;i++){
    const ch = src[i];
    if(q){
      if(ch==='"'){ if(src[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell += ch;
    }else if(ch==='"') q = true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(ch!=='\r') cell += ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
/* 「2026/9/4」「2026-09-04」「20260904」「9/4」などを拾う */
function parseDateCell(v){
  const t = String(v||'').trim().replace(/[年月]/g,'/').replace(/日/,'');
  let m = /^(\d{4})[/-](\d{1,2})[/-](\d{1,2})/.exec(t);
  if(m) return {y:+m[1], m:+m[2], d:+m[3]};
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(t);
  if(m) return {y:+m[1], m:+m[2], d:+m[3]};
  m = /^(\d{1,2})[/-](\d{1,2})$/.exec(t);
  if(m) return {y:view.y, m:+m[1], d:+m[2]};
  return null;
}
function parseAmountCell(v){
  const t = String(v||'').replace(/[,¥￥\s円]/g,'').replace(/[▲△]/,'-');
  if(!t || !/^-?\d+(\.\d+)?$/.test(t)) return null;
  return Math.round(Number(t));
}

function startCsvImport(){
  pickFile('.csv,text/csv,text/plain', text=>{
    const rows = parseCsv(text);
    if(rows.length<2){ toast('CSVを読み取れませんでした'); return; }
    const width = Math.max(...rows.map(r=>r.length));
    const head = rows[0].map(c=>String(c).trim());
    const looksHeader = head.some(c=>/日付|年月日|取引日|利用日|摘要|内容|金額|入金|出金|お預り|お支払/.test(c))
      || !parseDateCell(head[0]);
    const body = looksHeader ? rows.slice(1) : rows;
    /* 各列を見て、日付らしい列・金額らしい列を推測する */
    const score = Array.from({length:width},()=>({date:0, amt:0, text:0}));
    body.slice(0,40).forEach(r=>{
      for(let i=0;i<width;i++){
        const v = r[i];
        if(parseDateCell(v)) score[i].date++;
        else if(parseAmountCell(v)!==null) score[i].amt++;
        else if(String(v||'').trim()) score[i].text++;
      }
    });
    const best = k => score.reduce((b,o,i)=> o[k]>score[b][k] ? i : b, 0);
    const amtCols = score.map((o,i)=>({i,n:o.amt})).filter(o=>o.n>0).sort((a,b)=>b.n-a.n);
    const byName = re => { const i = head.findIndex(c=>re.test(c)); return i<0 ? null : i; };
    view.imp = {
      stage:'map', cols:head, rows:body, header:looksHeader,
      iDate: byName(/日付|年月日|取引日|利用日/) ?? best('date'),
      iName: byName(/摘要|内容|店名|利用店|お取引/) ?? best('text'),
      iIn:  byName(/入金|お預り|預入/) ?? (amtCols[0] ? amtCols[0].i : 0),
      iOut: byName(/出金|お支払|引落|支払/) ?? (amtCols[1] ? amtCols[1].i : 0),
      mode: byName(/入金|お預り|預入/)!=null && byName(/出金|お支払|引落|支払/)!=null ? 'two' : 'ex',
      exCat: 'exother'
    };
    view.modal = {kind:'import'};
    render();
  });
}

function buildCsvPreview(){
  const st = view.imp;
  const out = [];
  let skipped = 0;
  const known = new Set(state.biz.map(b=>b.y+'/'+b.m+'/'+b.d+'/'+b.amount));
  st.rows.forEach(r=>{
    const dt = parseDateCell(r[st.iDate]);
    if(!dt){ skipped++; return; }
    let type = 'ex', amt = null;
    if(st.mode==='two'){
      const vin = parseAmountCell(r[st.iIn]), vout = parseAmountCell(r[st.iOut]);
      if(vin && vin>0){ type='in'; amt=vin; }
      else if(vout && vout>0){ type='ex'; amt=vout; }
    }else{
      const v = parseAmountCell(r[st.iIn]);
      if(v!==null && v!==0){
        if(st.mode==='one'){ type = v>0 ? 'in' : 'ex'; amt = Math.abs(v); }
        else { type = 'ex'; amt = Math.abs(v); }
      }
    }
    if(!amt || amt<1){ skipped++; return; }
    const name = String(r[st.iName]||'').trim().slice(0,60) || (type==='in'?'入金':'支払');
    out.push({type, name, amount:amt, y:dt.y, m:dt.m, d:dt.d,
      cat: type==='in' ? 'sales' : st.exCat,
      dup: known.has(dt.y+'/'+dt.m+'/'+dt.d+'/'+amt)});
  });
  st.parsed = out;
  st.skipped = skipped;
  st.stage = 'confirm';
}

    .sort((a,b)=>a.y-b.y||a.m-b.m||a.d-b.d||(a.type<b.type?-1:1))
    .map(b=>[b.type==='in'?'収入':'経費', b.y+'/'+pad(b.m)+'/'+pad(b.d),
      b.name, BIZ_CAT_MAP[b.cat].label, b.amount, b.note]);
  const csv = '\uFEFF' + [head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  dl.save({filename:'sonae-shushi.csv', data:csv})
    .then(()=>toast('CSVを保存しました'))
    .catch(err=>{ if(err && err.code!=='declined') toast('CSVを保存できませんでした'); });
}

function exportJournalCsv(){
  if(!dl) return;
  const y = view.y;
  const pad = n => String(n).padStart(2,'0');
  const eom = (yy,mm) => yy+'/'+pad(mm)+'/'+pad(daysInMonth(yy,mm));
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const salesTx = state.profile.invoice ? '課税売上10%' : '対象外';
  const rows = [];

  const dstr = b => y+'/'+pad(b.m)+'/'+pad(b.d);
  state.biz.filter(b=>b.y===y).sort((a,b)=>a.m-b.m||a.d-b.d).forEach(b=>{
    const memo = b.name + (b.note ? '　'+b.note : '');
    if(b.type==='in'){
      rows.push([dstr(b), '事業主貸', b.amount, '対象外',
        ACC_IN[b.cat]||'売上高', b.amount, salesTx, memo]);
    }else{
      rows.push([dstr(b), ACC_EX[b.cat]||'雑費', b.amount, '課税仕入10%',
        '事業主借', b.amount, '対象外', memo]);
    }
  });

  /* 家事按分：月ごとに勘定科目でまとめる（今年は当月まで） */
  const lastM = (y===NOW.getFullYear()) ? NOW.getMonth()+1 : 12;
  for(let m=1;m<=lastM;m++){
    const byAcc = new Map();
    state.payments.filter(p=>p.bizPct>0 && occursIn(p,y,m)).forEach(p=>{
      const amt = Math.round(p.amount*p.bizPct/100);
      if(amt<=0) return;
      const acc = ACC_FIX[p.cat] || '雑費';
      const cat = CAT_MAP[p.cat];
      const cur = byAcc.get(acc) || {amt:0, names:[], tx:!!(cat&&cat.tx)};
      cur.amt += amt;
      cur.names.push(p.name+'（'+p.bizPct+'%）');
      byAcc.set(acc, cur);
    });
    byAcc.forEach((v,acc)=>{
      rows.push([eom(y,m), acc, v.amt, v.tx?'課税仕入10%':'対象外',
        '事業主借', v.amt, '対象外', '家事按分　'+v.names.join('、')]);
    });
  }

  if(!rows.length){ toast(y+'年の記録がないため書き出せません'); return; }
  const head = ['取引日','借方勘定科目','借方金額','借方税区分',
    '貸方勘定科目','貸方金額','貸方税区分','摘要'];
  const csv = '\uFEFF' + [head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  dl.save({filename:'sonae-shiwake-'+y+'.csv', data:csv})
    .then(()=>toast(y+'年の仕訳CSVを保存しました（'+rows.length+'行）'))
    .catch(err=>{ if(err && err.code!=='declined') toast('CSVを保存できませんでした'); });
}

root.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act==='section'){ view.section=b.dataset.sec; view.pendingDelete=null; render(); }
  else if(act==='prev') shiftMonth(-1);
  else if(act==='next') shiftMonth(1);
  else if(act==='yprev'){ view.y--; render(); }
  else if(act==='ynext'){ view.y++; render(); }
  else if(act==='today'){ view.y=NOW.getFullYear(); view.m=NOW.getMonth()+1; render(); }
  else if(act==='tab'){ view.tab=b.dataset.tab; view.pendingDelete=null; render(); }
  else if(act==='cat'){
    const c=b.dataset.cat;
    if(view.cats.has(c)) view.cats.delete(c); else view.cats.add(c);
    render();
  }
  else if(act==='add') openModal({kind:'pay', mode:'add'});
  else if(act==='edit') openModal({kind:'pay', mode:'edit', id});
  else if(act==='addbiz') openModal({kind:'biz', mode:'add', type:b.dataset.type||'in'});
  else if(act==='editbiz') openModal({kind:'biz', mode:'edit', id});
  else if(act==='del' || act==='bizdel'){ view.pendingDelete=id; render(); }
  else if(act==='del2'){
    view.pendingDelete=null;
    persist({payments: state.payments.filter(p=>p.id!==id)});
  }
  else if(act==='bizdel2'){
    view.pendingDelete=null;
    persist({biz: state.biz.filter(x=>x.id!==id)});
  }
  else if(act==='close') closeModal();
  else if(act==='overlay'){ if(e.target===b) closeModal(); }
  else if(act==='mdel' || act==='bmdel'){ view.modalDelete=true; render(); }
  else if(act==='mdel2'){
    const pid=view.modal && view.modal.id;
    view.modal=null; view.modalDelete=false;
    persist({payments: state.payments.filter(p=>p.id!==pid)});
  }

    view.modal=null; view.modalDelete=false;
    persist({biz: state.biz.filter(x=>x.id!==pid)});
  }

  else if(act==='bizgoto'){ view.m=Number(b.dataset.m); view.bizTab='month'; hideTip(); render(); }
  else if(act==='biztab'){ view.bizTab=b.dataset.tab; view.pendingDelete=null; render(); }
  else if(act==='bizsort'){ view.bizSort = view.bizSort==='desc' ? 'asc' : 'desc'; render(); }
  else if(act==='bizfilter'){ view.bizFilter = b.dataset.f; view.pendingDelete=null; render(); }
  else if(act==='tipsall'){ view.tipsAll = !view.tipsAll; render(); }
  else if(act==='taxtab'){ view.taxTab=b.dataset.tab; view.pendingDelete=null; render(); }

    persist({profile: Object.assign({}, state.profile, {setupDone:true})});
  }

  else if(act==='data') openModal({kind:'data'});
  else if(act==='about') openModal({kind:'about'});
  else if(act==='guide') openModal({kind:'guide'});
  else if(act==='me'){

      view.invDraft = readInvForm();
      view.invReturn = Object.assign({}, view.modal);
    }
    openModal({kind:'me'});
  }
  else if(act==='backup') exportBackup();
  else if(act==='restore') restoreBackup();
  else if(act==='restore2'){
    const n = view.restore && view.restore.next;
    view.restore = null; view.modal = null;
    if(n){
      state = {v:4, payments:[], biz:[], saves:[], invoices:[], taxPaid:{}, profile:state.profile};
      persist(n);
      toast('バックアップから復元しました');
    }
  }
  else if(act==='csvimport'){ view.modal=null; render(); startCsvImport(); }
  else if(act==='impgo'){
    const add = view.imp.parsed.map(e=>normalizeBiz(e));
    view.imp=null; view.modal=null;
    persist({biz: state.biz.concat(add)});
    toast(add.length+'件を取り込みました');
  }
  /* 納付済みのチェック */
  else if(act==='taxpaid'){
    const k = b.dataset.key;
    const next = Object.assign({}, state.taxPaid);
    if(next[k]) delete next[k]; else next[k] = true;
    persist({taxPaid: next});
  }
  /* 積立 */
  else if(act==='addsave') openModal({kind:'save', mode:'add'});
  else if(act==='editsave') openModal({kind:'save', mode:'edit', id});
  else if(act==='savedel'){ view.pendingDelete=id; render(); }
  else if(act==='savedel2'){
    view.pendingDelete=null;

  }
  else if(act==='smdel'){ view.modalDelete=true; render(); }
  else if(act==='smdel2'){
    const sid=view.modal && view.modal.id;
    view.modal=null; view.modalDelete=false;
    persist({saves: state.saves.filter(v=>v.id!==sid)});
  }
  /* 入金 */
  else if(act==='markpaid'){
    persist({biz: state.biz.map(x=>x.id===id ? Object.assign({}, x, {paid:true}) : x)});
    toast('入金済みにしました');
  }
  /* 請求書 */
  else if(act==='addinv'){ view.invDraft=null; openModal({kind:'invoice', mode:'add'}); }
  else if(act==='editinv'){
    const v = state.invoices.find(x=>x.id===id);
    view.invDraft = v ? Object.assign({}, v, {items: v.items.map(o=>Object.assign({},o))}) : null;
    openModal({kind:'invoice', mode:'edit', id});
  }
  else if(act==='invout') exportInvoice(id);
  else if(act==='invadd'){
    const d = readInvForm();
    d.items = d.items.concat([{name:'', qty:1, unit:'式', price:0}]);
    view.invDraft = d; render();
  }
  else if(act==='invdel'){
    const d = readInvForm();
    d.items.splice(Number(b.dataset.i), 1);
    if(!d.items.length) d.items = [{name:'', qty:1, unit:'式', price:0}];
    view.invDraft = d; render();
  }
  else if(act==='imdel'){ view.modalDelete=true; render(); }
  else if(act==='imdel2'){
    const iid=view.modal && view.modal.id;
    const inv=state.invoices.find(x=>x.id===iid);
    view.modal=null; view.modalDelete=false; view.invDraft=null;
    persist({invoices: state.invoices.filter(x=>x.id!==iid),
      biz: inv && inv.bizId ? state.biz.filter(x=>x.id!==inv.bizId) : state.biz});
  }
  else if(act==='csv') exportCsv();
  else if(act==='bizcsv') exportBizCsv();
  else if(act==='jrncsv') exportJournalCsv();
  else if(act==='stmtcsv') exportStatementCsv();
});

root.addEventListener('submit', e=>{
  const val = id => { const el=document.getElementById(id); return el ? el.value : ''; };
  const chk = id => { const el=document.getElementById(id); return !!(el && el.checked); };
  if(e.target.id==='pay-form'){
    e.preventDefault();
    const p = normalizePayment({
      id: view.modal && view.modal.mode==='edit' ? view.modal.id : undefined,
      name: val('m-name').trim(), amount: val('m-amount'), day: val('m-day'),
      cat: val('m-cat'), method: val('m-method'), freq: val('m-freq'),
      month: val('m-month'), note: val('m-note').trim(), bizPct: val('m-bizpct')
    });
    if(!p.name || !(Number(val('m-amount'))>0)) return;
    const next = view.modal && view.modal.mode==='edit'
      ? state.payments.map(x=>x.id===p.id ? p : x)
      : state.payments.concat([p]);
    view.modal=null; view.modalDelete=false; view.pendingDelete=null;
    persist({payments: next});
  }
  else if(e.target.id==='biz-form'){
    e.preventDefault();
    const type = e.target.dataset.type==='ex' ? 'ex' : 'in';
    const dparts = (val('b-date')||'').split('-').map(Number);
    if(dparts.length!==3 || !dparts[0]) return;
    const bz = normalizeBiz({
      id: view.modal && view.modal.mode==='edit' ? view.modal.id : undefined,
      type, name: val('b-name').trim(), amount: val('b-amount'),
      y: dparts[0], m: dparts[1], d: dparts[2],
      cat: val('b-cat'), note: val('b-note').trim(),
      due: document.getElementById('b-due') ? val('b-due') : '',
      paid: document.getElementById('b-paid') ? val('b-paid')==='1' : true
    });
    if(!bz.name || !(Number(val('b-amount'))>0)) return;
    const next = view.modal && view.modal.mode==='edit'
      ? state.biz.map(x=>x.id===bz.id ? bz : x)
      : state.biz.concat([bz]);
    /* 「記録して次へ」なら、日付と種別を引き継いだ空の入力に戻す */
    const again = e.submitter && e.submitter.name==='again';
    view.modalDelete=false; view.pendingDelete=null;
    if(again){
      view.modal = {kind:'biz', mode:'add', type, keep:{y:bz.y, m:bz.m, d:bz.d, cat:bz.cat}};
      persist({biz: next});
      const f = document.getElementById('b-name');
      if(f) f.focus();
      toast(yen(bz.amount)+' を記録しました');

      view.modal=null;
      persist({biz: next});

        medR: val('c-medr'), medK: val('c-medk'), medH: val('c-medh'),
        supR: val('c-supr'), supK: val('c-supk'), supH: val('c-suph'),
        careR: val('c-carer'), careK: val('c-carek'), careH: val('c-careh')
      }
    })});
    toast('設定を保存しました');
  }
});
root.addEventListener('mouseover', e=>{
  const b = e.target.closest('.ybar,.dmon');
  if(b) showTip(b.dataset.tip, e.clientX, e.clientY);
});
root.addEventListener('mousemove', e=>{
  const b = e.target.closest('.ybar,.dmon');
  if(b && tipEl) showTip(b.dataset.tip, e.clientX, e.clientY);
});
root.addEventListener('mouseout', e=>{
  if(e.target.closest('.ybar,.dmon')) hideTip();
});
root.addEventListener('focusin', e=>{
  const b = e.target.closest('.ybar,.dmon');
  if(b){ const r=b.getBoundingClientRect(); showTip(b.dataset.tip, r.left, r.top); }
});
root.addEventListener('focusout', e=>{
  if(e.target.closest('.ybar,.dmon')) hideTip();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && view.modal) closeModal();
});

render();
</script>
</body>
</html>
