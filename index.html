  --rule:rgba(51,81,143,.055);
  --c-sub:#2a78d6; --c-home:#eb6834; --c-util:#1baf7a; --c-net:#eda100;
  --c-ins:#e87ba4; --c-loan:#008300; --c-other:#4a3aa7;
  --bar-dim:#c6cfe2;
  --shadow:0 1px 2px rgba(35,40,56,.06),0 8px 24px rgba(35,40,56,.05);
  --shadow-lg:0 4px 12px rgba(35,40,56,.12),0 20px 48px rgba(35,40,56,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161d; --surface:#1d212b; --surface2:#262b37; --ink:#e9eaf0; --muted:#9aa0b0;
    --line:#333947; --accent:#93ace0; --accent-soft:#93ace022; --accent-ink:#101523; --hanko:#e0684f;
    --rule:rgba(147,172,224,.06);
    --c-sub:#3987e5; --c-home:#d95926; --c-util:#199e70; --c-net:#c98500;
    --c-ins:#d55181; --c-loan:#008300; --c-other:#9085e9;
    --bar-dim:#3a4356;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#14161d; --surface:#1d212b; --surface2:#262b37; --ink:#e9eaf0; --muted:#9aa0b0;
  --line:#333947; --accent:#93ace0; --accent-soft:#93ace022; --accent-ink:#101523; --hanko:#e0684f;
  --rule:rgba(147,172,224,.06);
  --c-sub:#3987e5; --c-home:#d95926; --c-util:#199e70; --c-net:#c98500;
  --c-ins:#d55181; --c-loan:#008300; --c-other:#9085e9;
  --bar-dim:#3a4356;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.45);
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 120px}
button{font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
h1{font-family:"Shippori Mincho","Noto Sans JP",serif;font-weight:600;font-size:1.7rem;margin:2px 0 0;letter-spacing:.06em}
.monthnav{display:flex;align-items:center;gap:4px}
.nav-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.05rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--surface2)}
.month-label{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.05rem;min-width:8.2em;text-align:center;font-variant-numeric:tabular-nums}
.today-chip{border:0;background:none;color:var(--accent);font-size:.75rem;cursor:pointer;padding:2px 8px;border-radius:999px;text-decoration:underline;text-underline-offset:3px}

/* section nav */
.seg-nav{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:16px}
.seg{flex:1;border:0;background:none;color:var(--muted);padding:9px 6px;border-radius:9px;cursor:pointer;font-size:.88rem;font-weight:500;text-align:center;white-space:nowrap}
.seg:hover{color:var(--ink)}
.seg.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* hero */
.summary{padding:22px 24px 18px;margin-bottom:14px;background-image:repeating-linear-gradient(to bottom,transparent 0 26px,var(--rule) 26px 27px)}
.sum-label{font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.sum-total{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:clamp(2rem,6vw,2.7rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin:0 0 10px}
.sum-total small{font-size:.45em;font-weight:500;color:var(--muted)}
.sum-row{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.83rem;color:var(--muted)}
.sum-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;margin-left:4px}
.bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:16px 0 10px}
.bar span{min-width:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;margin-left:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex:none}
.next-line{margin-top:14px;font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.next-line b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin:18px 0 12px;width:max-content}
.tab{border:0;background:none;color:var(--muted);padding:7px 18px;border-radius:7px;cursor:pointer;font-size:.88rem;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* filters */
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filters input[type="search"]{flex:1;min-width:150px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.88rem}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:.85rem}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 12px 3px 9px;font-size:.76rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cat-chip:hover{color:var(--ink)}
.cat-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:500}

/* list view */
.sched{padding:2px 0;overflow:hidden}
.day{display:grid;grid-template-columns:92px 1fr;align-items:start;padding:14px 20px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.next-up{box-shadow:inset 3px 0 0 var(--accent)}
.day-col{display:flex;align-items:center;padding-top:2px;flex-wrap:wrap;gap:2px}
.day-num{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.35rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.day-num small{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:2px}
.eom-note{font-size:.65rem;color:var(--muted);width:100%}
.day.paid .items,.day.paid .day-num{opacity:.5}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid var(--hanko);color:var(--hanko);border-radius:50%;font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:.85rem;transform:rotate(-10deg);margin-left:8px;opacity:.85;flex:none}
.tag{display:inline-block;font-size:.68rem;line-height:1.6;padding:1px 8px;border-radius:999px;margin-left:8px;flex:none}
.tag.next{background:var(--accent);color:var(--accent-ink)}
.tag.today{background:var(--hanko);color:#fff}
.tag.warn{background:var(--hanko);color:#fff;margin-left:0}
.tag.ok{border:1px solid var(--line);color:var(--muted);margin-left:0}
.item{display:flex;align-items:center;gap:10px;padding:5px 0;flex-wrap:wrap}
.item-main{display:flex;flex-direction:column;min-width:0}
.item-name{font-weight:500;line-height:1.4}
.item-sub{font-size:.72rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;line-height:1.5}
.freq-badge{display:inline-block;font-size:.66rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);vertical-align:1px;margin-left:6px}
.chip{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;flex:none}
.amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item-actions{display:flex;gap:2px;margin-left:6px}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.72rem;padding:3px 7px;border-radius:6px}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.del:hover{color:var(--hanko)}
.icon-btn.confirm{background:var(--hanko);color:#fff}
.icon-btn.confirm:hover{background:var(--hanko);color:#fff}

/* calendar view */
.cal{padding:14px;overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{font-size:.68rem;color:var(--muted);text-align:center;padding:2px 0 6px}
.cal-wd.sun{color:var(--hanko)}
.cal-cell{min-height:86px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:.72rem;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.cal-cell.blank{border:0;background:none;min-height:0}
.cal-cell.next-up{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.cal-cell.past .cal-items,.cal-cell.past .cal-daytotal{opacity:.5}
.cal-daynum{font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.4;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.cal-cell.today .cal-daynum{border:2px solid var(--hanko);border-radius:50%;color:var(--hanko);font-weight:600}
.cal-items{display:flex;flex-direction:column;gap:1px;min-width:0}
.cal-item{display:flex;align-items:center;gap:4px;min-width:0;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;font-size:.7rem;line-height:1.5}
.cal-item:hover .cal-item-name{text-decoration:underline}
.cal-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-more{font-size:.66rem;color:var(--muted)}
.cal-daytotal{margin-top:auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:.7rem;text-align:right}
@media (max-width:600px){
  .cal-cell{min-height:64px;padding:4px}
  .cal-item-name{display:none}
  .cal-item{font-size:.66rem}
}

/* year view + charts */
.year{padding:20px 24px}
.year h2,.panel h2{font-size:.9rem;font-weight:600;margin:0 0 16px}
.ychart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:140px;border-bottom:1px solid var(--line)}
.ybar{position:relative;border:0;background:none;padding:0;cursor:pointer;height:100%;display:flex;align-items:flex-end}
.ybar-fill{width:100%;background:var(--bar-dim);border-radius:4px 4px 0 0;min-height:2px}
.ybar.cur .ybar-fill{background:var(--accent)}
.ybar:hover .ybar-fill,.ybar:focus-visible .ybar-fill{background:var(--accent)}
.ychart-labels{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font-size:.68rem;color:var(--muted);text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums}
.ychart-labels .cur{color:var(--accent);font-weight:600}
.ychart-labels span{white-space:nowrap}
.ychart-labels i{font-style:normal}
/* 月別収支：左に目盛り、いちばん高い月にだけ数字 */
.dwrap{padding-left:44px}
.dgline{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.dgline i{position:absolute;right:100%;top:0;transform:translateY(-50%);padding-right:7px;
  font-style:normal;font-size:.62rem;line-height:1;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.dchart{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line)}
.dmon{position:relative;display:flex;align-items:flex-end;gap:2px;height:100%;border:0;background:none;padding:0;cursor:pointer}
.dlab{position:absolute;font-size:.62rem;line-height:1;white-space:nowrap;pointer-events:none;
  color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dbar{flex:1;border-radius:3px 3px 0 0;min-height:0}
.dbar.in{background:var(--c-sub)}
.dbar.ex{background:var(--c-home)}
.ytable{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:22px}
.ytable th{font-size:.72rem;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ytable th.num,.ytable td.num{text-align:right;font-variant-numeric:tabular-nums}
.ytable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.ytable tr:last-child td{border-bottom:0;font-weight:600}
.ytip{position:fixed;z-index:30;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 10px;border-radius:8px;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}

/* biz + tax panels */
.panel{padding:20px 24px;margin-bottom:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.panel-head h2{margin:0}
.panel-head .actions{display:flex;gap:6px}
.btn-sm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:.78rem;font-weight:500;cursor:pointer}
.btn-sm:hover{background:var(--surface2)}
.panel-head .cnt{font-size:.72rem;color:var(--muted);font-weight:500}
/* 納付スケジュール */
.dues{margin-top:12px}
.due{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.due:first-child{border-top:0}
.due.paid{opacity:.5}
.due.near{box-shadow:inset 3px 0 0 var(--hanko);padding-left:10px}
.due-date{font-size:.66rem;color:var(--muted);text-align:center;line-height:1.4;font-variant-numeric:tabular-nums;padding-top:2px}
.due-date b{display:block;font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.05rem;color:var(--ink);font-weight:600}
.due-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.due-label{font-weight:500;font-size:.9rem}
.due-note{font-size:.72rem;color:var(--muted);line-height:1.6;margin-top:2px}
.due-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.due-right .amt{margin-left:0}
/* 積立の進捗 */
.prog-num{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.prog-num small{font-size:.5em;font-weight:500;color:var(--muted)}
.prog{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.warn-dot{color:var(--hanko);font-weight:600}
.item-name .tag{margin-left:6px;vertical-align:1px}
.ytable tr.sec td{background:var(--surface2);font-size:.72rem;color:var(--muted);font-weight:600;padding:5px 8px}
.ytable tr.sum td{font-weight:700;border-bottom:2px solid var(--line)}
.ytable tr:last-child td{font-weight:700}
.sub-note{font-size:.68rem;color:var(--muted)}
.setup{padding:26px 24px}
.setup-lead{font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
.setup-title{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.35rem;font-weight:600;margin:4px 0 12px}
.setup-next{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted);line-height:1.8}
.setup-next ol{margin:8px 0 12px;padding-left:1.3em}
.setup-next li{margin-bottom:4px}
.setup-next b{color:var(--ink)}
.guide-q{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0;font-size:.85rem;line-height:1.7}
.guide-q>div{color:var(--muted);font-size:.8rem;margin-top:2px}
.guide-q b{font-weight:600}
.g-table{font-size:.78rem}
.g-table td,.g-table th{padding:6px 8px;vertical-align:top}
.g-table td:nth-child(2){white-space:nowrap}
.g-table .g-why{color:var(--muted);font-size:.72rem}
@media (max-width:560px){.g-table .g-why,.g-table th:nth-child(3){display:none}}
.yoy{margin-left:4px}
.yoy.up{color:var(--c-util)}
.yoy.down{color:var(--hanko)}
.tabs{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap}
/* 請求書 */
.inv-items{display:grid;grid-template-columns:1fr 62px 56px 92px 28px;gap:6px;align-items:center}
.inv-items .ih{font-size:.66rem;color:var(--muted)}
.inv-items input{padding:7px 8px;font-size:.85rem}
.inv-del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px}
.inv-del:hover{color:var(--hanko)}
@media (max-width:560px){
  .inv-items{grid-template-columns:1fr 52px 46px 78px 24px;gap:4px}
  .inv-items input{padding:6px 5px;font-size:.8rem}
}
.tips h2{margin-bottom:10px}
.mg-line{font-size:.83rem;line-height:1.85;color:var(--muted);margin-bottom:16px}
.mg-line b{color:var(--ink);font-weight:600}
.tip{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.tip.hot{border-left:3px solid var(--accent)}
.tip-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tip-title{font-weight:600;font-size:.93rem;line-height:1.5}
.tip-save{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap;font-size:.88rem}
.tip-body{font-size:.79rem;color:var(--muted);line-height:1.85;margin-top:5px}
.tip-body b{color:var(--ink);font-weight:600}
.tip-note{font-size:.74rem;color:var(--muted);line-height:1.7;margin-top:7px}
.tip-when{font-size:.75rem;line-height:1.7;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.tip-when b{font-weight:600}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.chip-row .cat-chip .cnt{color:var(--muted);font-size:.7rem;font-variant-numeric:tabular-nums}
.chip-row .cat-chip.active .cnt{color:var(--ink)}
.group-label{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin:12px 0 2px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:.9rem}
.trow:first-of-type{border-top:0}
.trow .tlab small{display:block;color:var(--muted);font-size:.71rem;line-height:1.5}
.trow .tval{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.trow.total{border-top:1px solid var(--line);font-weight:700}
.trow.total .tval{font-size:1.05rem}
.notice{border:1px solid var(--line);border-left:3px solid var(--hanko);border-radius:8px;padding:10px 14px;font-size:.75rem;color:var(--muted);margin-top:14px;background:var(--surface)}
#set-form[data-wm="side"] .wm-free{display:none}
#set-form[data-wm="free"] .wm-side{display:none}
#set-form[data-ht="manual"] .ht-nhi{opacity:.45}
#set-form[data-ht="nhi"] .ht-manual{opacity:.45}
#set-form[data-ht="nhi"] .ht-note-manual{display:none}
#set-form[data-inv="0"] .ct-field{display:none}
#set-form[data-ct="special20"] .ct-simple,#set-form[data-ct="special20"] .ct-standard{display:none}
#set-form[data-ct="simple"] .ct-standard{display:none}
#set-form[data-ct="standard"] .ct-simple{display:none}
.info-notice{border-left-color:var(--accent);margin:0 0 14px}
.check-line{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink);padding:6px 0}
.check-line input{width:auto}
.warn-notice{border-left-color:var(--hanko);color:var(--ink);margin:0 0 14px}
.hint{font-size:.72rem;color:var(--muted);line-height:1.6;margin:2px 0 4px}
.hint b{color:var(--ink)}
.rate-grid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.rate-grid .rg-head{font-size:.68rem;color:var(--muted)}
.rate-grid .rg-lab{font-size:.78rem;color:var(--muted);white-space:nowrap}
.rate-grid input{padding:7px 8px;font-size:.85rem}

/* empty state */
.empty{padding:36px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
.empty .btn{margin-top:14px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,29,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:600px){.overlay{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px 24px}
.modal h2{font-family:"Shippori Mincho","Noto Sans JP",serif;font-size:1.15rem;font-weight:600;margin:0 0 14px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.preset{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.75rem;cursor:pointer}
.preset:hover{color:var(--ink);border-color:var(--muted)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-full{grid-column:1/-1}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem}
.hidden{display:none}
.f-actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:none;color:var(--muted)}
.btn-ghost:hover{color:var(--ink)}
.btn-danger{background:none;color:var(--hanko);margin-left:auto}
.btn-danger.confirm{background:var(--hanko);color:#fff}

/* fab */
.fab{position:fixed;right:20px;bottom:20px;z-index:10;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.92rem;padding:13px 22px;cursor:pointer;box-shadow:var(--shadow-lg)}
.fab:hover{filter:brightness(1.08)}

footer{margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.linklike{border:0;background:none;color:var(--accent);cursor:pointer;font-size:.75rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow);z-index:40;max-width:90vw}
@media (prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.tab,.seg,.cat-chip,.nav-btn,.ybar-fill,.btn-sm{transition:background-color .15s,color .15s,border-color .15s}
  .modal{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:560px){
  .panel .item{align-items:flex-start}
  .panel .item .item-actions{flex:0 0 100%;justify-content:flex-end;margin-left:0;margin-top:2px}

  .f-grid{grid-template-columns:1fr}
  .summary,.panel{padding:18px 16px}
  .year{padding:16px 14px}
}

function nhiConfig(pr){
  if(pr.nhiCity==='custom'){
    const c = pr.nhiCustom;
    return {label:'入力した料率', custom:true, comps:{
      med:{r:c.medR,k:c.medK,h:c.medH,cap:670000},
      sup:{r:c.supR,k:c.supK,h:c.supH,cap:260000},
      care:{r:c.careR,k:c.careK,h:c.careH,cap:170000},
      kid:null
    }};
  }
  const preset = NHI_PRESETS[pr.nhiCity];
  if(preset) return {label:preset.label+'・令和8年度', custom:false, comps:preset};
  const pref = NHI_PREF_MAP[pr.nhiPref];
  if(pref && pref.std){
    const s = pref.std;
    return {label:pref.label+'の標準保険料率・令和'+(s.year==='R8'?'8':'7')+'年度',
      custom:false, std:true, comps:{
      med:{r:s.med.r,k:s.med.k,h:0,cap:670000},
      sup:{r:s.sup.r,k:s.sup.k,h:0,cap:260000},
      care:{r:s.care.r,k:s.care.k,h:0,cap:170000},
      kid:null
    }};
  }
  return {label:'東京23区（標準的な区）・令和8年度', custom:false, comps:NHI_PRESETS.tokyostd};
}
function nhiAmount(pr, income){
  const cfg = nhiConfig(pr);
  const nb = Math.max(0, income - TAX.nhiBase);
  const mem = pr.nhiMembers;
  const comp = (c,members)=>{
    if(!c || (c.r<=0 && c.k<=0 && c.h<=0)) return 0;
    return Math.min(nb*c.r/100 + c.k*members + c.h, c.cap);
  };
  let total = comp(cfg.comps.med, mem) + comp(cfg.comps.sup, mem)
    + (cfg.comps.kid ? comp(cfg.comps.kid, mem) : 0);
  if(pr.care40) total += comp(cfg.comps.care, 1);
  return {amount: Math.round(total), cfg};
}
function salaryDeduction(sal){
  if(sal<=1900000) return Math.min(sal,650000);
  if(sal<=3600000) return sal*.30+80000;
  if(sal<=6600000) return sal*.20+440000;
  if(sal<=8500000) return sal*.10+1100000;
  return 1950000;
}
function basicDeduction(totalIncome){
  for(const [lim,d] of TAX.basicDed) if(totalIncome<=lim) return d;
  return 0;
}
/* 課税所得に対する所得税の限界税率（復興特別所得税込み） */
function marginalIncomeRate(taxable){
  if(taxable<=0) return 0;
  for(const [lim,r] of TAX.brackets) if(taxable<=lim) return r*1.021;
  return 0;
}
/* 住民税の調整控除。人的控除の差の合計をもとに計算する */
function residentAdjust(rtTaxable, humanDiff){
  if(rtTaxable<=0) return 0;
  const diff = 50000 + Math.max(0, humanDiff);   // 基礎控除の差5万円は一律
  if(rtTaxable<=2000000) return Math.round(Math.min(diff, rtTaxable) * 0.05);
  return Math.max(2500, Math.round((diff - (rtTaxable-2000000)) * 0.05));
}
function incomeTaxOn(taxableRaw){
  const t = Math.floor(Math.max(0,taxableRaw)/1000)*1000;
  for(const [lim,r,d] of TAX.brackets){
    if(t<=lim) return Math.floor(Math.max(0, t*r-d)*1.021/100)*100;
  }
  return 0;
}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function yen(n){return '¥' + Math.round(Number(n)||0).toLocaleString('ja-JP');}
/* グラフの目盛り用。1万円以上は「万」でまとめる */
function yenShort(n){
  n = Math.round(Number(n)||0);
  if(Math.abs(n) >= 100000000){
    const oku = n/100000000;
    return '¥' + (Number.isInteger(oku) ? oku : oku.toFixed(1)) + '億';
  }
  if(Math.abs(n) >= 10000){
    const man = n/10000;
    return '¥' + (Number.isInteger(man) ? man : man.toFixed(1)) + '万';
  }
  return yen(n);
}
/* きりのいい目盛りを作る。3本くらいになる刻みを選ぶ */
function niceScale(v, ticks){
  ticks = ticks || 4;
  if(!(v>0)) return {max:1, step:1, lines:[]};
  const raw = v/ticks;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw/pow;
  const step = (n<=1 ? 1 : n<=1.5 ? 1.5 : n<=2 ? 2 : n<=2.5 ? 2.5 : n<=5 ? 5 : 10) * pow;
  const max = Math.ceil(v/step)*step;
  const lines = [];
  for(let t=step; t<=max+step/2; t+=step) lines.push(Math.round(t));
  return {max, step, lines};
}
function uid(){return Math.random().toString(36).slice(2,8) + Date.now().toString(36);}
function daysInMonth(y,m){return new Date(y, m, 0).getDate();}
function pad2(n){return String(n).padStart(2,'0');}
/* 'YYYY-MM-DD' を検証して返す（不正なら空文字） */
function dateStr(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m) return '';
  const y = +m[1], mo = +m[2], d = +m[3];
  if(y<2000 || y>2100 || mo<1 || mo>12 || d<1 || d>daysInMonth(y,mo)) return '';
  return v;
}
function dateJp(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  return m ? (+m[2])+'月'+(+m[3])+'日' : '';
}
function todayStr(){return NOW.getFullYear()+'-'+pad2(NOW.getMonth()+1)+'-'+pad2(NOW.getDate());}
/* 期日までの日数（過ぎていれば負） */
function daysUntil(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m) return null;
  const t = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  return Math.round((new Date(+m[1], +m[2]-1, +m[3]) - t) / 86400000);
}
function occursIn(p,y,m){
  if(p.freq === 'yearly') return m === p.month;
  if(p.freq === 'bimonthly') return ((m - p.month) % 2 + 2) % 2 === 0;
  return true;
}
function effDay(p,y,m){return Math.min(p.day, daysInMonth(y,m));}
function monthlyEquiv(p){
  if(p.freq === 'yearly') return p.amount/12;
  if(p.freq === 'bimonthly') return p.amount/2;
  return p.amount;
}

function migrate(s){

  const taxPaid = {};

    Object.keys(s.taxPaid).forEach(k=>{
      if(/^[0-9a-z:-]{1,40}$/.test(k) && s.taxPaid[k]) taxPaid[k] = true;
    });
  }
  return {
    v:4,
    payments: (Array.isArray(s.payments)?s.payments:[]).map(normalizePayment),
    biz: (Array.isArray(s.biz)?s.biz:[]).map(normalizeBiz),
    saves: (Array.isArray(s.saves)?s.saves:[]).map(normalizeSave),
    invoices: (Array.isArray(s.invoices)?s.invoices:[]).map(normalizeInvoice),
    taxPaid,
    profile: normalizeProfile(s.profile)
  };
}

/* ---------- 所得控除 ----------
   所得税と住民税では控除額が違うものが多いので、必ず2本立てで持つ。
   小規模企業共済等掛金控除・社会保険料控除・医療費控除は同額、
   生命保険料・地震保険料・人的控除は住民税のほうが小さい。 */

/* 新制度の生命保険料控除（1区分ぶん） */
function lifeInsDed(pay, forResident){
  pay = Math.max(0, Math.round(pay)||0);
  if(pay<=0) return 0;
  if(forResident){
    if(pay<=12000) return pay;
    if(pay<=32000) return Math.floor(pay/2)+6000;
    if(pay<=56000) return Math.floor(pay/4)+14000;
    return 28000;
  }
  if(pay<=20000) return pay;
  if(pay<=40000) return Math.floor(pay/2)+10000;
  if(pay<=80000) return Math.floor(pay/4)+20000;
  return 40000;
}
/* 配偶者控除・配偶者特別控除。本人の合計所得で3段階に減る */
function spouseDed(ownIncome, spIncome, isOld){
  const tier = ownIncome<=9000000 ? 0 : ownIncome<=9500000 ? 1 : ownIncome<=10000000 ? 2 : -1;
  if(tier<0) return {it:0, rt:0, label:'', human:0};
  if(spIncome<=580000){
    const it = isOld ? [480000,320000,160000][tier] : [380000,260000,130000][tier];
    const rt = isOld ? [380000,260000,130000][tier] : [330000,220000,110000][tier];
    return {it, rt, label:'配偶者控除'+(isOld?'（70歳以上）':''), human:it-rt};
  }
  /* 配偶者特別控除（令和7年分から所得の区切りが10万円上がっている） */
  const steps = [
    [1050000, 380000, 330000], [1100000, 360000, 330000], [1150000, 310000, 310000],
    [1200000, 260000, 260000], [1250000, 210000, 210000], [1300000, 160000, 160000],
    [1330000, 110000, 110000]
  ];
  for(const [lim, it0, rt0] of steps){
    if(spIncome<=lim){
      const scale = [1, 2/3, 1/3][tier];
      const it = Math.floor(it0*scale/1000)*1000, rt = Math.floor(rt0*scale/1000)*1000;
      return {it, rt, label:'配偶者特別控除', human:Math.max(0, it-rt)};
    }
  }
  return {it:0, rt:0, label:'', human:0};
}

/* 社会保険料控除・基礎控除以外の所得控除をまとめて出す。
   human は住民税の調整控除に使う「人的控除の差」 */
function calcDeductions(pr, income){
  const d = pr.ded;
  const rows = [];
  let it = 0, rt = 0, human = 0;
  const add = (label, a, b, note, isHuman)=>{
    if(a<=0 && b<=0) return;
    rows.push({label, it:a, rt:b, note});
    it += a; rt += b;
    if(isHuman) human += Math.max(0, a-b);
  };

  const kyosai = d.kyosai + d.ideco;
  add('小規模企業共済等掛金控除', kyosai, kyosai,
    [d.kyosai>0?'小規模企業共済 '+yen(d.kyosai):'', d.ideco>0?'iDeCo '+yen(d.ideco):'']
      .filter(Boolean).join('・')+'（全額）');

  const lifeIt = Math.min(120000,
    lifeInsDed(d.lifeGen,false) + lifeInsDed(d.lifeMed,false) + lifeInsDed(d.lifePen,false));
  const lifeRt = Math.min(70000,
    lifeInsDed(d.lifeGen,true) + lifeInsDed(d.lifeMed,true) + lifeInsDed(d.lifePen,true));
  add('生命保険料控除', lifeIt, lifeRt,
    '支払 '+yen(d.lifeGen+d.lifeMed+d.lifePen)+'（上限 所得税12万・住民税7万）');

  const quakeIt = Math.min(50000, d.quake);
  const quakeRt = Math.min(25000, Math.floor(d.quake/2));
  add('地震保険料控除', quakeIt, quakeRt, '支払 '+yen(d.quake));

  const medBase = Math.min(100000, Math.round(income*0.05));
  const med = Math.min(2000000, Math.max(0, d.medical - d.medicalIns - medBase));
  add('医療費控除', med, med,
    '自己負担 '+yen(d.medical)+(d.medicalIns?' − 補填 '+yen(d.medicalIns):'')+' − '+yen(medBase));

  if(d.spouse){
    const sp = spouseDed(income, d.spouseIncome, d.spouseOld);
    if(sp.it>0){
      rows.push({label:sp.label, it:sp.it, rt:sp.rt, note:'配偶者の合計所得 '+yen(d.spouseIncome)});
      it += sp.it; rt += sp.rt; human += sp.human;
    }
  }
  add('扶養控除（一般）', d.depGeneral*380000, d.depGeneral*330000, d.depGeneral+'人', true);
  add('扶養控除（特定・19〜22歳）', d.depSpecific*630000, d.depSpecific*450000, d.depSpecific+'人', true);
  add('扶養控除（老人・同居老親等）', d.depOldLive*580000, d.depOldLive*450000, d.depOldLive+'人', true);
  add('扶養控除（老人・その他）', d.depOldOther*480000, d.depOldOther*380000, d.depOldOther+'人', true);
  add('障害者控除', d.disability*270000, d.disability*260000, d.disability+'人', true);
  add('特別障害者控除', d.disabilitySp*400000, d.disabilitySp*300000, d.disabilitySp+'人', true);
  add('同居特別障害者控除', d.disabilityLive*750000, d.disabilityLive*530000, d.disabilityLive+'人', true);
  if(d.hitorioya) add('ひとり親控除', 350000, 300000, '', true);
  else if(d.kafu) add('寡婦控除', 270000, 260000, '', true);
  if(d.kinro) add('勤労学生控除', 270000, 260000, '', true);
  add('その他の所得控除', d.other, d.other, '入力した額をそのまま適用');

  return {it, rt, rows, human};
}

/* ふるさと納税。所得税は所得控除、住民税は税額控除（基本分＋特例分） */
function furusato(pr, income, itRate, rtIncomeTax){
  const g = pr.ded.furusato;
  if(g<=2000) return {itDed:0, rtCredit:0, limit:0, over:false};
  const itDed = Math.max(0, Math.min(g, income*0.4) - 2000);
  const base = Math.max(0, Math.min(g, income*0.3) - 2000) * 0.10;
  const cap = rtIncomeTax * 0.20;
  const rate = 0.90 - itRate;
  const specialRaw = rate>0 ? (g-2000) * rate : 0;
  const special = Math.min(specialRaw, cap);
  /* 自己負担2,000円で収まる寄附の上限 */
  const limit = rate>0 ? Math.floor((cap/rate + 2000)/1000)*1000 : 0;
  return {itDed, rtCredit: Math.round(base+special), limit, over: specialRaw > cap+1};
}

/* 年ごとの事業の利益（青色控除前・按分込み） */
function yearProfit(y){
  return bizSum(y,'in') - bizSum(y,'ex') - apportionYear(y);
}
/* 純損失の繰越控除。青色申告なら赤字を3年間繰り越して、黒字の年から引ける。
   古い年のぶんから順に使い、使い切れなかったものは4年目で消える。 */
function lossCarry(y){
  if(state.profile.filing === 'white') return {avail:0, pool:[]};
  const years = state.biz.map(b=>b.y);
  if(!years.length) return {avail:0, pool:[]};
  let pool = [];
  for(let yy = Math.max(Math.min(...years), y-3); yy < y; yy++){
    pool = pool.filter(o=>o.y >= yy-3);          // 期限切れを落とす
    const p = yearProfit(yy);
    if(p < 0){ pool.push({y:yy, amount:-p}); continue; }
    let rest = p;
    pool.forEach(o=>{ const use = Math.min(o.amount, rest); o.amount -= use; rest -= use; });
    pool = pool.filter(o=>o.amount > 0);
  }
  pool = pool.filter(o=>o.y >= y-3);
  return {avail: pool.reduce((s,o)=>s+o.amount, 0), pool};
}

/* ---------- tax engine ---------- */
function calcTax(y, opts){
  opts = opts || {};
  const pr = state.profile;
  const inSum = bizSum(y,'in');
  const exEntries = bizSum(y,'ex');
  const ap = apportionYear(y);
  const expenses = exEntries + ap;
  const rawProfit = inSum - expenses;             // 赤字なら負のまま
  const profit = Math.max(0, rawProfit);         // 青色控除前の事業利益

  if(pr.workMode === 'free'){
    const blueMax = pr.filing==='blue65' ? 650000 : pr.filing==='blue10' ? 100000 : 0;
    const blue = Math.min(blueMax, profit);
    /* 繰り越した赤字は、青色申告特別控除のあとの所得から引く */
    const carry = lossCarry(y);
    const carryUsed = Math.min(carry.avail, Math.max(0, profit - blue));
    const income = Math.max(0, profit - blue - carryUsed);   // 総所得金額等
    const pension = TAX.pensionMonthly*12;
    let nhi, nhiRes;
    if(pr.hiType==='manual'){
      nhi = pr.hiManual*12;
      nhiRes = {amount:nhi, cfg:{label:'入力した保険料', manual:true, comps:{}}};
    }else{
      nhiRes = nhiAmount(pr, income);
      nhi = nhiRes.amount;
    }
    /* 国民年金基金・付加年金は公的年金への上乗せなので社会保険に含める。
       小規模企業共済とiDeCoは自分の資産なので、控除にだけ効かせる */
    const social = pension + nhi + pr.ded.nenkinKikin;
    const ded = calcDeductions(pr, income);
    const basic = basicDeduction(income);
    const itRate = marginalIncomeRate(income - social - ded.it - basic);
    const rtPre = Math.floor(Math.max(0, income - social - ded.rt - TAX.residentBasic)/1000)*1000;
    const rtIncomeTax = rtPre>0 ? Math.round(rtPre*TAX.residentRate) : 0;
    const fs = furusato(pr, income, itRate, rtIncomeTax);
    const itTaxable = income - social - ded.it - fs.itDed - basic;
    const it = incomeTaxOn(itTaxable);
    const rtTaxable = rtPre;
    const adj = residentAdjust(rtTaxable, ded.human);
    const rt = (rtTaxable>0 ? Math.max(0, rtIncomeTax - adj - fs.rtCredit) : 0)
      + (income > TAX.residentMin ? TAX.residentFlat : 0);
    /* 個人事業税は青色申告特別控除を足し戻すが、損失の繰越は同じように使える */
    const btBase = Math.max(0, profit - carryUsed);
    const bt = pr.bizTaxRate>0 ? Math.round(Math.max(0, btBase - TAX.bizTaxExempt) * pr.bizTaxRate/100) : 0;
    const salesTax = Math.floor(inSum*10/110);
    let ct = 0, purchaseTax = 0, ctLabel = 'インボイス未登録';
    if(pr.invoice){
      if(pr.ctMethod === 'simple'){
        const sc = CT_SIMPLE_MAP[pr.ctSimpleType] || CT_SIMPLE_MAP[5];
        ct = Math.floor(salesTax*(1-sc.rate)/100)*100;
        ctLabel = '簡易課税・'+sc.label;
      }else if(pr.ctMethod === 'standard'){
        const taxableEx = exEntries*pr.ctPurchasePct/100 + apportionTaxableYear(y);
        purchaseTax = Math.floor(taxableEx*10/110);
        ct = Math.max(0, Math.floor((salesTax - purchaseTax)/100)*100);
        ctLabel = '本則課税';
      }else{
        ct = Math.floor(salesTax*0.2/100)*100;
        ctLabel = '2割特例';
      }
    }
    /* 予定納税：前年の所得税が15万円以上なら、その3分の1を7月と11月に前払いしている */
    let prepaid = 0, prepayEach = 0, prevIt = 0;
    if(!opts.noPrev){
      prevIt = calcTax(y-1, {noPrev:true}).it;
      if(prevIt >= TAX.prepayThreshold){
        prepayEach = Math.floor(prevIt/3/100)*100;
        prepaid = prepayEach*2;
      }
    }
    const itDue = it - prepaid;                  // 確定申告で納める額（マイナスなら還付）
    const taxTotal = it + rt + bt + ct;
    const net = inSum - expenses - taxTotal - social;
    return {mode:'free', inSum, exEntries, ap, expenses, rawProfit, profit, blue, blueMax, income,
      pension, nhi, nhiCfg:nhiRes.cfg, social, basic, itTaxable:Math.max(0,itTaxable), rtTaxable,
      ded, fs, adj, carry, carryUsed, prevIt, prepaid, prepayEach, itDue,
      itTaxableRounded: Math.floor(Math.max(0,itTaxable)/1000)*1000,
      it, rt, bt, ct, salesTax, purchaseTax, ctLabel,
      taxTotal, all: taxTotal+social, net, monthly: Math.ceil((taxTotal+social)/12/1000)*1000};
  }

  /* 会社員 + 副業（副業は雑所得として概算） */
  const sideProfit = profit;
  const sal = pr.salary;
  const salIncome = Math.max(0, sal - salaryDeduction(sal));
  const social = pr.salarySocial>0 ? pr.salarySocial : Math.round(sal*TAX.salarySocialRate);
  const totalIncome = salIncome + sideProfit;
  const ded = calcDeductions(pr, totalIncome);
  const extra = ded.it;
  const itAll  = incomeTaxOn(totalIncome - social - extra - basicDeduction(totalIncome));
  const itBase = incomeTaxOn(salIncome  - social - extra - basicDeduction(salIncome));
  const addIT = Math.max(0, itAll - itBase);
  const addRT = Math.round(sideProfit*TAX.residentRate);
  const taxTotal = addIT + addRT;
  const sideTaxable = totalIncome - social - extra - basicDeduction(totalIncome);
  return {mode:'side', inSum, exEntries, ap, expenses, rawProfit, sideProfit, sal, salIncome, social,
    totalIncome, sideTaxable, ded, addIT, addRT, taxTotal, needFiling: sideProfit>200000,
    net: inSum - expenses - taxTotal, monthly: Math.ceil(taxTotal/12/100)*100};
}

/* ============================================================
   render
   ============================================================ */
function render(){
  const focused = document.activeElement;
  const focusId = focused && focused.id;
  let selS=null, selE=null;
  if(focused && typeof focused.selectionStart === 'number'){
    try{ selS = focused.selectionStart; selE = focused.selectionEnd; }catch(e){}
  }

  const today = new Date();
  const ctx = { ty: today.getFullYear(), tm: today.getMonth()+1, td: today.getDate() };

  let navLabel, navPrev='prev', navNext='next';
  const yearOnly = view.section==='tax'
    || (view.section==='biz' && view.bizTab==='all');
  if(view.section==='tax'){ navLabel = view.y+'年分'; navPrev='yprev'; navNext='ynext'; }
  else if(yearOnly){ navLabel = view.y+'年'; navPrev='yprev'; navNext='ynext'; }
  else navLabel = view.y+'年'+view.m+'月';
  const isCurMonth = view.y===ctx.ty && view.m===ctx.tm;
  const showToday = yearOnly ? view.y!==ctx.ty : !isCurMonth;

  const setup = needsSetup();
  let content;
  if(setup) content = renderSetup();
  else if(view.section==='pay') content = renderPay(ctx);
  else if(view.section==='biz') content = renderBiz(ctx);
  else content = renderTax(ctx);

  const saveNote = saveMode === 'artifact' ? '変更は自動で保存されます'
    : saveMode === 'local' ? 'この端末（ブラウザ）に保存されます' : '';

  root.innerHTML =
    '<header class="masthead">'
    + '<div><div class="eyebrow">毎月の支払いと税金に、そなえる</div><h1>Sonae</h1></div>'
    + (setup ? '' : '<div><div class="monthnav">'
    + '<button class="nav-btn" data-act="'+navPrev+'" aria-label="前へ">‹</button>'
    + '<span class="month-label">'+navLabel+'</span>'
    + '<button class="nav-btn" data-act="'+navNext+'" aria-label="次へ">›</button>'
    + '</div>'
    + (showToday ? '<div style="text-align:center"><button class="today-chip" data-act="today">今月に戻る</button></div>' : '')
    + '</div>')
    + '</header>'
    + (setup ? '' : '<nav class="seg-nav">'
      + segBtn('pay','支払い') + segBtn('biz','仕事の収支') + segBtn('tax','税金の目安')
      + '</nav>')
    + content
    + '<footer><span>固定費'+state.payments.length+'件・収支'+state.biz.length+'件　'+saveNote+backupWarn()+'</span>'
    + '<span><button class="linklike" data-act="data">データと設定</button>　'
    + '<button class="linklike" data-act="guide">支払いと経費の使い分け</button>　'
    + '<button class="linklike" data-act="about">このアプリについて</button></span></footer>'
    + (view.modal ? modalHtml() : '');

  /* fab */
  const fabDef = view.modal ? null
    : view.section==='pay' && state.payments.length ? {label:'＋ 支払いを追加', act:'add'}
    : null;
  let fab = document.getElementById('fab');
  if(fabDef){
    if(!fab){
      fab = document.createElement('button');
      fab.id='fab'; fab.className='fab';
      document.body.appendChild(fab);
      fab.addEventListener('click',()=>{
        if(fab.dataset.act==='add') openModal({kind:'pay', mode:'add'});
        else openModal({kind:'biz', mode:'add', type:'in'});
      });
    }
    fab.textContent = fabDef.label; fab.dataset.act = fabDef.act;
  }else if(fab){ fab.remove(); }

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selS!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(selS,selE); }catch(e){}
      }
    }
  }
}

/* ---------- section: pay ---------- */
function renderPay(c){
  const y = view.y, m = view.m;
  const isCurrent = y===c.ty && m===c.tm;
  const isPast = y<c.ty || (y===c.ty && m<c.tm);
  const all = paymentsFor(y,m,{filtered:false});
  const ps  = paymentsFor(y,m);
  const filterActive = !!(view.q || view.cats.size || view.method);
  const total = all.reduce((s,p)=>s+p.amount,0);
  const equiv = state.payments.reduce((s,p)=>s+monthlyEquiv(p),0);

  let heroStats;
  if(isCurrent){
    const paid = all.filter(p=>effDay(p,y,m)<c.td).reduce((s,p)=>s+p.amount,0);
    heroStats = '<span>支払い済み<b>'+yen(paid)+'</b></span>'
      + '<span>これから<b>'+yen(total-paid)+'</b></span>'
      + '<span>月平均<b>'+yen(equiv)+'</b></span>';
  }else{
    heroStats = '<span>'+all.length+'件の支払い</span>'
      + '<span>月平均<b>'+yen(equiv)+'</b></span>'
      + '<span>年間換算<b>'+yen(equiv*12)+'</b></span>';
  }

  let nextLine = '';
  let highlightDay = null;
  if(isCurrent && all.length){
    const dayNums = [...new Set(all.map(p=>effDay(p,y,m)))].sort((a,b)=>a-b);
    highlightDay = dayNums.find(d=>d>=c.td);
    if(highlightDay == null){
      const nm = m===12 ? 1 : m+1, nyy = m===12 ? y+1 : y;
      const nAll = paymentsFor(nyy,nm,{filtered:false});
      if(nAll.length){
        const nd = Math.min(...nAll.map(p=>effDay(p,nyy,nm)));
        nextLine = nextLineHtml(nm+'月'+nd+'日', nAll.filter(p=>effDay(p,nyy,nm)===nd));
      }
    }else{
      nextLine = nextLineHtml(highlightDay===c.td ? '今日' : m+'月'+highlightDay+'日',
        all.filter(p=>effDay(p,y,m)===highlightDay));
    }
  }

  const catTotals = CATS
    .map(cc=>({...cc, sum: all.filter(p=>p.cat===cc.id).reduce((s,p)=>s+p.amount,0)}))
    .filter(cc=>cc.sum>0);
  const bar = catTotals.map(cc=>'<span style="flex:'+cc.sum+';background:var(--c-'+cc.id+')"></span>').join('');
  const legend = catTotals.map(cc=>'<span><span class="dot" style="background:var(--c-'+cc.id+')"></span>'+cc.label+'<b>'+yen(cc.sum)+'</b></span>').join('');

  const hero = state.payments.length ? (
    '<section class="card summary">'
    + '<div class="sum-label">'+(isCurrent ? '今月の支払い' : y+'年'+m+'月の支払い')+'</div>'
    + '<div class="sum-total">'+yen(total)+'</div>'
    + '<div class="sum-row">'+heroStats+'</div>'
    + (catTotals.length ? '<div class="bar">'+bar+'</div><div class="legend">'+legend+'</div>' : '')
    + nextLine
    + '</section>'
  ) : '';

  let content = '';
  if(!state.payments.length){
    content = '<section class="empty">まだ支払いが登録されていません。<br>家賃やサブスクなど、毎月・隔月・年1回の支払いを登録すると、<br>月ごとの合計やカレンダーがここに表示されます。'
      + '<div><button class="btn btn-primary" data-act="add">最初の支払いを追加</button></div>'
      + '<div style="margin-top:14px;font-size:.8rem">仕事の経費とどう分けるか迷ったら　'
      + '<button class="linklike" data-act="guide">使い分けを見る</button></div></section>';
  }else if(view.tab === 'list'){
    content = filtersHtml() + listHtml(ps, y, m, {isCurrent, isPast, td:c.td, highlightDay});
  }else if(view.tab === 'cal'){
    content = filtersHtml() + calendarHtml(ps, y, m, {isCurrent, isPast, td:c.td, highlightDay});
  }else{
    content = yearHtml(y, c);
  }
  if(state.payments.length && view.tab!=='year' && filterActive && !ps.length){
    content += '<section class="empty" style="margin-top:10px">条件に合う支払いがありません。</section>';
  }

  return hero
    + (state.payments.length ?
      '<div class="tabs" role="tablist">'
      + tabBtn('list','リスト') + tabBtn('cal','カレンダー') + tabBtn('year','年間')
      + '</div>' : '')
    + content;
}

function nextLineHtml(when, items){
  const sum = items.reduce((s,p)=>s+p.amount,0);
  const names = esc(items[0].name) + (items.length>1 ? ' ほか'+(items.length-1)+'件' : '');
  return '<div class="next-line">次の支払い：<b>'+when+'　'+names+'　'+yen(sum)+'</b></div>';
}

function filtersHtml(){
  const chips = CATS.map(c=>{
    const on = view.cats.has(c.id);
    return '<button class="cat-chip'+(on?' active':'')+'" data-act="cat" data-cat="'+c.id+'" aria-pressed="'+on+'">'
      + '<span class="dot" style="background:var(--c-'+c.id+')"></span>'+c.label+'</button>';
  }).join('');
  const methods = '<option value="">支払い方法：すべて</option>'
    + METHODS.map(mt=>'<option value="'+mt.id+'"'+(view.method===mt.id?' selected':'')+'>'+mt.label+'</option>').join('');
  return '<div class="filters">'
    + '<input id="search" type="search" placeholder="名前・メモで検索" value="'+esc(view.q)+'" autocomplete="off">'
    + '<select id="f-method" aria-label="支払い方法で絞り込み">'+methods+'</select>'
    + '</div><div class="cat-chips">'+chips+'</div>';

function itemMeta(p){
  const bits = [];
  if(p.freq==='yearly') bits.push('年1回（'+p.month+'月）');
  bits.push(METHOD_MAP[p.method].label);
  if(p.bizPct>0) bits.push('経費'+p.bizPct+'%');
  if(p.note) bits.push(esc(p.note));
  return bits.join('　');
}

function payDelBtn(id){
  return view.pendingDelete === id
    ? '<button type="button" class="icon-btn del confirm" data-act="del2" data-id="'+id+'">本当に削除？</button>'
    : '<button type="button" class="icon-btn del" data-act="del" data-id="'+id+'">削除</button>';
}

function listHtml(ps, y, m, ctx){
  if(!ps.length) return '';
  const dim = daysInMonth(y,m);
  const groups = new Map();
  ps.forEach(p=>{ const d = effDay(p,y,m); if(!groups.has(d)) groups.set(d,[]); groups.get(d).push(p); });
  const days = [...groups.keys()].sort((a,b)=>a-b);
  const rows = days.map(d=>{
    const isPaid = ctx.isPast || (ctx.isCurrent && d < ctx.td);
    const isToday = ctx.isCurrent && d === ctx.td;
    const isNext = ctx.isCurrent && d === ctx.highlightDay && !isPaid;
    const cls = 'day' + (isPaid?' paid':'') + (isNext?' next-up':'');
    let mark = '';
    if(isPaid) mark = '<span class="stamp">済</span>';
    else if(isToday) mark = '<span class="tag today">今日</span>';
    else if(isNext) mark = '<span class="tag next">つぎ</span>';
    const eom = groups.get(d).some(p=>p.day>dim) ? '<span class="eom-note">（月末扱い）</span>' : '';
    const items = groups.get(d).map(p=>{
      const cat = CAT_MAP[p.cat];
      return '<div class="item">'
        + '<div class="item-main"><span class="item-name">'+esc(p.name)
        + (p.freq!=='monthly' ? '<span class="freq-badge">'+(p.freq==='yearly'?'年1回':'隔月')+'</span>' : '')
        + '</span><span class="item-sub">'+itemMeta(p)+'</span></div>'
        + '<span class="chip"><span class="dot" style="background:var(--c-'+cat.id+')"></span>'+cat.label+'</span>'
        + '<span class="amt">'+yen(p.amount)+'</span>'
        + '<span class="item-actions">'
        + '<button type="button" class="icon-btn" data-act="edit" data-id="'+p.id+'">編集</button>'
        + payDelBtn(p.id)
        + '</span></div>';
    }).join('');
    return '<div class="'+cls+'"><div class="day-col"><span class="day-num">'+d+'<small>日</small></span>'+mark+eom+'</div><div class="items">'+items+'</div></div>';
  }).join('');
  return '<section class="card sched">'+rows+'</section>';
}

function calendarHtml(ps, y, m, ctx){
  const dim = daysInMonth(y,m);
  const first = new Date(y, m-1, 1).getDay();
  const byDay = new Map();
  ps.forEach(p=>{ const d = effDay(p,y,m); if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(p); });
  const wd = ['日','月','火','水','木','金','土']
    .map((w,i)=>'<div class="cal-wd'+(i===0?' sun':'')+'">'+w+'</div>').join('');
  let cells = '';
  for(let i=0;i<first;i++) cells += '<div class="cal-cell blank"></div>';
  for(let d=1;d<=dim;d++){
    const items = byDay.get(d) || [];
    const isPaid = ctx.isPast || (ctx.isCurrent && d < ctx.td);
    const isToday = ctx.isCurrent && d === ctx.td;
    const isNext = ctx.isCurrent && d === ctx.highlightDay && !isPaid && items.length;
    const cls = 'cal-cell' + (items.length?' has':'') + (isToday?' today':'') + (isNext?' next-up':'') + (isPaid?' past':'');
    const shown = items.slice(0,3).map(p=>
      '<button type="button" class="cal-item" data-act="edit" data-id="'+p.id+'" title="'+esc(p.name)+' '+yen(p.amount)+'">'
      + '<span class="dot" style="background:var(--c-'+p.cat+')"></span>'
      + '<span class="cal-item-name">'+esc(p.name)+'</span></button>').join('');
    const more = items.length>3 ? '<span class="cal-more">＋'+(items.length-3)+'件</span>' : '';
    const sum = items.reduce((s,p)=>s+p.amount,0);
    cells += '<div class="'+cls+'"><span class="cal-daynum">'+d+'</span>'
      + '<div class="cal-items">'+shown+more+'</div>'
      + (items.length ? '<span class="cal-daytotal">'+yen(sum)+'</span>' : '')
      + '</div>';
  }
  return '<section class="card cal"><div class="cal-grid">'+wd+cells+'</div></section>';
}

function yearHtml(y, c){
  const totals = Array.from({length:12},(_,i)=>monthTotal(y,i+1));
  const max = Math.max(...totals, 1);
  const bars = totals.map((t,i)=>{
    const m = i+1;
    const cur = y===c.ty && m===c.tm;
    const h = Math.round(t/max*100);
    return '<button type="button" class="ybar'+(cur?' cur':'')+'" data-act="goto" data-m="'+m+'"'
      + ' data-tip="'+y+'年'+m+'月　'+yen(t)+'" aria-label="'+y+'年'+m+'月 '+yen(t)+'">'
      + '<span class="ybar-fill" style="height:'+Math.max(h, t>0?3:1)+'%"></span></button>';
  }).join('');
  const labels = totals.map((t,i)=>'<span class="'+(y===c.ty && i+1===c.tm?'cur':'')+'">'+(i+1)+'<i class="mlab">月</i></span>').join('');
  const annual = totals.reduce((s,t)=>s+t,0);
  const catRows = CATS.map(cc=>{
    let sum = 0;
    for(let m=1;m<=12;m++) sum += state.payments.filter(p=>p.cat===cc.id && occursIn(p,y,m)).reduce((s,p)=>s+p.amount,0);
    return {cc, sum};
  }).filter(r=>r.sum>0)
    .sort((a,b)=>b.sum-a.sum)
    .map(r=>'<tr><td><span class="dot" style="background:var(--c-'+r.cc.id+')"></span>'+r.cc.label+'</td>'
      + '<td class="num">'+yen(r.sum/12)+'</td><td class="num">'+yen(r.sum)+'</td></tr>').join('');
  return '<section class="card year">'
    + '<h2>'+y+'年の月別合計</h2>'
    + '<div class="ychart">'+bars+'</div>'
    + '<div class="ychart-labels">'+labels+'</div>'
    + '<table class="ytable"><thead><tr><th>カテゴリ</th><th class="num">月平均</th><th class="num">年間</th></tr></thead><tbody>'
    + catRows
    + '<tr><td>合計</td><td class="num">'+yen(annual/12)+'</td><td class="num">'+yen(annual)+'</td></tr>'
    + '</tbody></table>'
    + '</section>';
}

/* 前年と比べる。前年の記録が無いときは何も出さない */
function yoyLine(y){
  const prev = state.biz.filter(b=>b.y===y-1);
  if(!prev.length) return '';
  const pin = bizSum(y-1,'in'), pex = bizSum(y-1,'ex') + apportionYear(y-1);
  const cin = bizSum(y,'in'),   cex = bizSum(y,'ex')   + apportionYear(y);
  const part = (label, cur, old0)=>{
    if(!old0) return '';
    const d = cur - old0;
    const pct = Math.round(d/old0*100);
    const sign = d>0 ? '＋' : d<0 ? '−' : '±';
    const cls = label==='経費' ? (d>0?'down':'up') : (d>0?'up':'down');
    return '<span>'+label+'<b class="yoy '+(d===0?'':cls)+'">'+sign+yen(Math.abs(d))
      + (Math.abs(pct)<1000 ? '（'+sign+Math.abs(pct)+'%）' : '')+'</b></span>';
  };
  const body = part('収入', cin, pin) + part('経費', cex, pex)
    + part('利益', cin-cex, pin-pex);
  if(!body) return '';
  return '<div class="next-line">'+(y-1)+'年と比べて　'+body+'</div>';
}

/* ---------- section: biz ---------- */
function renderBiz(c){
  const y = view.y, m = view.m;
  const inY = bizSum(y,'in'), exY = bizSum(y,'ex'), apY = apportionYear(y);
  const profit = inY - exY - apY;

  if(!state.biz.length && !apY){
    return '<section class="empty">仕事の収入と経費を月ごとに記録すると、<br>月別の収支グラフと「税金の目安」が使えるようになります。<br><br>'
      + '家賃や通信費など<b>毎月決まって出ていくもの</b>は、ここではなく「支払い」に登録し、<br>'
      + '「経費にする割合」を決めてください（そのぶんは自動で経費になります）。'
      + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
      + '<button class="btn btn-primary" data-act="addbiz" data-type="in">収入を記録</button>'
      + '<button class="btn btn-ghost" data-act="addbiz" data-type="ex">経費を記録</button>'
      + '</div>'
      + '<div style="margin-top:14px;font-size:.8rem">分け方に迷ったら　'
      + '<button class="linklike" data-act="guide">使い分けを見る</button></div></section>';
  }

  const unp = unpaidList();
  const unpSum = unp.reduce((s,b)=>s+b.amount, 0);
  const overdue = unp.filter(b=>b.due && daysUntil(b.due)<0);
  const hero =
    '<section class="card summary">'
    + '<div class="sum-label">'+y+'年の仕事の収支</div>'
    + '<div class="sum-total">'+(profit<0?'−':'')+yen(Math.abs(profit))+'<small>　利益</small></div>'
    + '<div class="sum-row">'
    + '<span>収入<b>'+yen(inY)+'</b></span>'
    + '<span>経費<b>'+yen(exY)+'</b></span>'
    + '<span>固定費の按分<b>'+yen(apY)+'</b></span>'
    + '</div>'
    + yoyLine(y)
    + (unp.length ? '<div class="next-line">未入金：<b>'+unp.length+'件　'+yen(unpSum)+'</b>'
      + (overdue.length ? '　<span class="tag warn">期日超過 '+overdue.length+'件</span>' : '')
      + '　<button class="linklike" data-act="biztab" data-tab="unpaid">確認する</button></div>' : '')
    + '</section>';

  /* monthly paired bars */
  const months = Array.from({length:12},(_,i)=>{
    const mm=i+1;
    return {m:mm, inV:bizSum(y,'in',mm), exV:bizSum(y,'ex',mm)+Math.round(apportionMonth(y,mm))};
  });
  const peak = Math.max(...months.map(o=>Math.max(o.inV,o.exV)));
  const sc = niceScale(peak);
  /* 数字は目盛りで読ませる。直接の数字はいちばん高い月だけに付ける */
  const topIn = months.reduce((a,o)=> o.inV>a.inV ? o : a, months[0]);
  const topEx = months.reduce((a,o)=> o.exV>a.exV ? o : a, months[0]);
  const bars = months.map(o=>{
    const hi = o.inV>0 ? Math.max(2, o.inV/sc.max*100) : 0;
    const he = o.exV>0 ? Math.max(2, o.exV/sc.max*100) : 0;
    /* 端の月はラベルがはみ出さないように寄せる */
    const anchor = o.m<=2 ? 'left:0' : o.m>=11 ? 'right:0' : 'left:50%;transform:translateX(-50%)';
    const peakLabel = (v, h, cls) => '<span class="dlab '+cls+'" style="'+anchor
      + ';bottom:calc('+h.toFixed(1)+'% + 4px)">'+yenShort(v)+'</span>';
    return '<button type="button" class="dmon" data-act="bizgoto" data-m="'+o.m+'"'
      + ' data-tip="'+o.m+'月　収入'+yen(o.inV)+'　経費'+yen(o.exV)+'"'
      + ' aria-label="'+o.m+'月 収入'+yen(o.inV)+' 経費'+yen(o.exV)+'">'
      + (o===topIn && o.inV>0 ? peakLabel(o.inV, hi, 'in') : '')
      + (o===topEx && o.exV>0 && o!==topIn ? peakLabel(o.exV, he, 'ex') : '')
      + '<span class="dbar in" style="height:'+hi.toFixed(1)+'%"></span>'
      + '<span class="dbar ex" style="height:'+he.toFixed(1)+'%"></span>'
      + '</button>';
  }).join('');
  const glines = sc.lines.map(v=>'<span class="dgline" style="bottom:'
    + (v/sc.max*100).toFixed(2)+'%"><i>'+yenShort(v)+'</i></span>').join('');
  const labels = months.map(o=>'<span class="'+(y===c.ty&&o.m===c.tm?'cur':'')+'">'+o.m+'<i class="mlab">月</i></span>').join('');
  const chart =
    '<section class="card panel"><h2>'+y+'年の月別収支</h2>'
    + '<div class="dwrap">'
    + '<div class="dchart">'+(peak>0 ? glines : '')+bars+'</div>'
    + '<div class="ychart-labels">'+labels+'</div>'
    + '</div>'
    + '<div class="legend" style="margin-top:12px">'
    + '<span><span class="dot" style="background:var(--c-sub)"></span>収入</span>'
    + '<span><span class="dot" style="background:var(--c-home)"></span>経費（按分込み）</span>'
    + '</div>'
    + (peak>0 ? '<div class="hint" style="margin-top:8px">'
        + '棒の高さは左の目盛りが目安です。月を選ぶと、その月の記録に移ります。</div>' : '')
    + '</section>';

  /* selected month entries */
  const byDate = (a,b)=>a.d-b.d || b.amount-a.amount;
  const ins = state.biz.filter(b=>b.y===y&&b.m===m&&b.type==='in').sort(byDate);
  const exs = state.biz.filter(b=>b.y===y&&b.m===m&&b.type==='ex').sort(byDate);
  const apM = Math.round(apportionMonth(y,m));
  const row = b=>{
    const od = (b.type==='in' && !b.paid && b.due) ? daysUntil(b.due) : null;
    const badge = (b.type==='in' && !b.paid)
      ? (od!==null && od<0 ? '<span class="tag warn">未入金 '+(-od)+'日超過</span>'
        : '<span class="tag next">未入金'+(b.due?'（'+dateJp(b.due)+'予定）':'')+'</span>')
      : '';
    return '<div class="item">'
    + '<div class="item-main"><span class="item-name">'+esc(b.name)+badge+'</span>'
    + '<span class="item-sub">'+b.m+'/'+b.d+'　'+BIZ_CAT_MAP[b.cat].label
    + (b.note?'　'+esc(b.note):'')+'</span></div>'
    + '<span class="amt">'+(b.type==='in'?'＋':'−')+yen(b.amount)+'</span>'
    + '<span class="item-actions">'
    + '<button type="button" class="icon-btn" data-act="editbiz" data-id="'+b.id+'">編集</button>'
    + (b.type==='in' && !b.paid
      ? '<button type="button" class="icon-btn" data-act="markpaid" data-id="'+b.id+'">入金済みに</button>' : '')
    + (view.pendingDelete===b.id
      ? '<button type="button" class="icon-btn del confirm" data-act="bizdel2" data-id="'+b.id+'">本当に削除？</button>'
      : '<button type="button" class="icon-btn del" data-act="bizdel" data-id="'+b.id+'">削除</button>')
    + '</span></div>';
  };
  const monthCard =
    '<section class="card panel">'
    + '<div class="panel-head"><h2>'+y+'年'+m+'月の記録</h2><div class="actions">'
    + '<button class="btn-sm" data-act="addbiz" data-type="in">＋ 収入</button>'
    + '<button class="btn-sm" data-act="addbiz" data-type="ex">＋ 経費</button>'
    + '</div></div>'
    + (ins.length ? '<div class="group-label">収入</div>'+ins.map(row).join('') : '')
    + (exs.length ? '<div class="group-label">経費</div>'+exs.map(row).join('') : '')
    + (apM>0 ? '<div class="group-label">固定費からの経費按分</div>'
        + '<div class="item"><div class="item-main"><span class="item-name">按分合計</span>'
        + '<span class="item-sub">「支払い」で経費割合を設定した固定費の今月分</span></div>'
        + '<span class="amt">−'+yen(apM)+'</span></div>' : '')
    + (!ins.length && !exs.length && !apM
      ? '<div style="color:var(--muted);font-size:.85rem;padding:8px 0">この月の記録はまだありません。</div>' : '')
    + '</section>';

  /* 年間の一覧（日付順・種別で絞り込み・その場で編集できる） */
  const dir = view.bizSort==='desc' ? -1 : 1;
  const yearAll = state.biz.filter(b=>b.y===y);
  const nIn = yearAll.filter(b=>b.type==='in').length;
  const nEx = yearAll.length - nIn;
  const flt = view.bizFilter;
  const allEntries = yearAll.filter(b=> flt==='all' || b.type===flt)
    .sort((a,b)=> dir*(a.m-b.m) || dir*(a.d-b.d) || b.amount-a.amount);
  const fChip = (id,label,n,color)=>
    '<button class="cat-chip'+(flt===id?' active':'')+'" data-act="bizfilter" data-f="'+id+'"'
    + ' aria-pressed="'+(flt===id)+'">'
    + (color ? '<span class="dot" style="background:var(--c-'+color+')"></span>' : '')
    + label+'<span class="cnt">'+n+'</span></button>';
  const filterChips = '<div class="chip-row">'
    + fChip('all','すべて', yearAll.length, null)
    + fChip('in','収入', nIn, 'sub')
    + fChip('ex','経費', nEx, 'home')
    + '</div>';
  let lastM = null;
  const listRows = allEntries.map(b=>{
    let head = '';
    if(b.m !== lastM){ lastM = b.m; head = '<div class="group-label">'+b.m+'月</div>'; }
    return head + row(b);
  }).join('');
  const emptyMsg = !yearAll.length
    ? y+'年の記録はまだありません。'
    : flt==='in' ? y+'年の収入の記録はまだありません。'
    : flt==='ex' ? y+'年の経費の記録はまだありません。'
    : y+'年の記録はまだありません。';
  const allCard =
    '<section class="card panel">'
    + '<div class="panel-head"><h2>'+y+'年の記録　<span class="cnt">'+allEntries.length+'件</span></h2>'
    + '<div class="actions">'
    + '<button class="btn-sm" data-act="bizsort">'+(view.bizSort==='desc'?'新しい順':'古い順')+'</button>'
    + '<button class="btn-sm" data-act="addbiz" data-type="in">＋ 収入</button>'
    + '<button class="btn-sm" data-act="addbiz" data-type="ex">＋ 経費</button>'
    + '</div></div>'
    + filterChips
    + (allEntries.length ? listRows
      : '<div style="color:var(--muted);font-size:.85rem;padding:8px 0">'+emptyMsg+'</div>')
    + (apY>0 && flt!=='in' ? '<div class="hint" style="margin-top:12px">このほかに、固定費からの経費按分 '
      + yen(apY)+' が自動で計上されています（「支払い」の編集画面で設定）。</div>' : '')
    + '</section>';

  /* ---- 未入金 ---- */
  const unpRow = b=>{
    const dd = b.due ? daysUntil(b.due) : null;
    const state2 = dd===null ? '<span class="tag ok">予定日なし</span>'
      : dd<0 ? '<span class="tag warn">'+(-dd)+'日超過</span>'
      : dd===0 ? '<span class="tag warn">今日</span>'
      : '<span class="tag next">あと'+dd+'日</span>';
    return '<div class="item">'
      + '<div class="item-main"><span class="item-name">'+esc(b.name)+'　'+state2+'</span>'
      + '<span class="item-sub">売上 '+b.y+'/'+b.m+'/'+b.d
      + (b.due ? '　入金予定 '+b.due.replace(/-/g,'/') : '　入金予定日は未設定')
      + '</span></div>'
      + '<span class="amt">'+yen(b.amount)+'</span>'
      + '<span class="item-actions">'
      + '<button type="button" class="icon-btn" data-act="markpaid" data-id="'+b.id+'">入金済みに</button>'
      + '<button type="button" class="icon-btn" data-act="editbiz" data-id="'+b.id+'">編集</button>'
      + '</span></div>';
  };
  const unpaidCard =
    '<section class="card panel">'
    + '<div class="panel-head"><h2>未入金の売上</h2>'
    + '<span class="cnt">'+unp.length+'件　'+yen(unpSum)+'</span></div>'
    + (unp.length
      ? '<div class="hint">入金予定日の近い順です。'
        + '売上は請求した時点で計上するので、<b>未入金でも税金の計算には入っています</b>。</div>'
        + unp.map(unpRow).join('')
      : '<div class="hint">未入金の売上はありません。<br>'
        + '収入を登録するときに「未入金」を選んで入金予定日を入れると、'
        + '入金待ちの一覧と期日超過がここに出ます。</div>')
    + '</section>';

  const bizTabs = '<div class="tabs" role="tablist">'
    + bizTabBtn('month','月別') + bizTabBtn('all','年間の一覧')
    + bizTabBtn('unpaid','未入金'+(unp.length?'('+unp.length+')':''))
    + bizTabBtn('inv','請求書')
    + '</div>';

  const body = view.bizTab==='all' ? allCard
    : view.bizTab==='unpaid' ? unpaidCard
    : view.bizTab==='inv' ? renderInvoices()
    : monthCard;
  return hero + chart + bizTabs + body;
}

/* ---------- 納付スケジュール ----------
   y年分の税金は、翌年以降に納めます。納期限は自治体で多少ずれます。 */
function taxSchedule(t, y){
  const rows = [];
  const add = (key,label,date,amount,note)=>{
    if(amount>0) rows.push({key:y+':'+key, label, date, amount, note});
  };
  if(t.mode==='side'){
    add('it','所得税（副業分）', (y+1)+'-03-15', t.addIT,
      '確定申告の期限と同じ日です。給与から引かれる分とは別に納めます。');
    add('rt','住民税（副業分）', (y+1)+'-06-30', t.addRT,
      '申告のとき「自分で納付（普通徴収）」を選ぶと、勤務先を通さず自分で納められます。');
    return rows;
  }
  if(t.prepaid>0){
    add('pre1','予定納税　第1期', y+'-07-31', t.prepayEach,
      (y-1)+'年分の所得税 '+yen(t.prevIt)+' の3分の1を先に納めます（'+y+'年分の前払い）。');
    add('pre2','予定納税　第2期', y+'-11-30', t.prepayEach, '');
  }
  add('it', t.prepaid>0 ? '所得税（確定申告で精算）' : '所得税', (y+1)+'-03-15',
    Math.max(0, t.itDue),
    (t.prepaid>0
      ? '所得税 '+yen(t.it)+' から予定納税 '+yen(t.prepaid)+' を差し引いた残りです。'
      : '')
    + '確定申告の期限と同じ日です。振替納税にすると4月中旬の口座引き落としになります。');
  add('ct','消費税', (y+1)+'-03-31', t.ct,
    '所得税より2週間ほどあとです。振替納税なら4月下旬の引き落とし。');
  if(t.rt>0){
    const q = Math.round(t.rt/4/100)*100;
    add('rt1','住民税　第1期', (y+1)+'-06-30', q, '6月に納付書が届きます。');
    add('rt2','住民税　第2期', (y+1)+'-08-31', q, '');
    add('rt3','住民税　第3期', (y+1)+'-10-31', q, '');
    add('rt4','住民税　第4期', (y+2)+'-01-31', t.rt-q*3, '');
  }
  if(t.it >= TAX.prepayThreshold){
    const each = Math.floor(t.it/3/100)*100;
    rows.push({key:y+':nextpre', label:'（参考）'+(y+1)+'年分の予定納税', date:(y+1)+'-07-31',
      amount:each, note:y+'年分の所得税が15万円以上なので、'+(y+1)+'年は7月と11月に各 '
        + yen(each)+' を先に納めることになります。'+(y+2)+'年3月の確定申告で精算します。',
      info:true});
  }
  if(t.bt>0){
    const h = Math.round(t.bt/2/100)*100;
    add('bt1','個人事業税　第1期', (y+1)+'-08-31', h,
      '都道府県から通知が届きます。納めた年の必要経費になります。');
    add('bt2','個人事業税　第2期', (y+1)+'-11-30', t.bt-h, '');
  }
  return rows.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
/* 毎月かかるもの */
function monthlyDues(t){
  if(t.mode!=='free') return [];
  const out = [{label:'国民年金', amount:TAX.pensionMonthly, note:'毎月末が納期限。まとめて前納すると割引があります。'}];
  if(t.nhi>0){
    /* 国保は6月〜翌3月の10回払いが一般的。入力した金額はそのまま月額 */
    out.push({label: t.nhiCfg.manual ? '健康保険' : '国民健康保険',
      amount: t.nhiCfg.manual ? Math.round(t.nhi/12) : Math.round(t.nhi/10),
      note: t.nhiCfg.manual ? '入力した月額です。'
        : '年額 '+yen(t.nhi)+' を6月から翌3月の10回で納めるのが一般的です（自治体によって回数が違います）。'});
  }
  return out;
}
function savedBalance(){
  return state.saves.reduce((s,v)=>s+v.amount, 0);
}

function renderTaxCal(t, y){
  const rows = taxSchedule(t, y);
  const real = rows.filter(r=>!r.info);
  const done = real.filter(r=>state.taxPaid[r.key]);
  const left = real.filter(r=>!state.taxPaid[r.key]);
  const leftSum = left.reduce((s,r)=>s+r.amount, 0);
  const monthly = monthlyDues(t);
  const monthlySum = monthly.reduce((s,o)=>s+o.amount, 0);

  const rowHtml = r=>{
    const paid = !!state.taxPaid[r.key];
    const dd = daysUntil(r.date);
    const near = !paid && dd!==null && dd<=30 && dd>=0;
    const over = !paid && dd!==null && dd<0;
    const when = paid ? '<span class="tag ok">納付済み</span>'
      : over ? '<span class="tag warn">'+(-dd)+'日超過</span>'
      : dd===0 ? '<span class="tag warn">今日</span>'
      : dd!==null && dd<=60 ? '<span class="tag next">あと'+dd+'日</span>' : '';
    return '<div class="due'+(paid?' paid':'')+(near||over?' near':'')+'">'
      + '<div class="due-date">'+r.date.slice(0,4)+'<br><b>'+(+r.date.slice(5,7))+'/'+(+r.date.slice(8,10))+'</b></div>'
      + '<div class="due-main"><div class="due-head"><span class="due-label">'+r.label+'</span>'+when+'</div>'
      + (r.note ? '<div class="due-note">'+r.note+'</div>' : '')+'</div>'
      + '<div class="due-right"><span class="amt">'+yen(r.amount)+'</span>'
      + (r.info ? ''
        : '<button type="button" class="icon-btn" data-act="taxpaid" data-key="'+r.key+'">'
          + (paid?'取り消す':'納付済みに')+'</button>')
      + '</div>'
      + '</div>';
  };

  const refund = t.mode==='free' && t.itDue < 0
    ? '<div class="notice info-notice" style="margin:14px 0 0">予定納税 '+yen(t.prepaid)
      + ' が所得税 '+yen(t.it)+' を上回っているので、確定申告で <b>'+yen(-t.itDue)
      + '</b> ほど還付される見込みです。</div>'
    : '';
  const schedCard = rows.length
    ? '<section class="card panel">'
      + '<div class="panel-head"><h2>'+y+'年分の納付スケジュール</h2>'
      + '<span class="cnt">'+done.length+'／'+real.length+'件 納付済み</span></div>'
      + '<div class="hint">'+y+'年分の税金は、'+(y+1)+'年に入ってから納めます。'
      + '納期限は自治体によって数日ずれることがあります。通知書が届いたら実際の期限で確認してください。</div>'
      + '<div class="dues">'+rows.map(rowHtml).join('')+'</div>'
      + (leftSum>0 ? '<div class="trow total"><span class="tlab">これから納める分</span>'
        + '<span class="tval">'+yen(leftSum)+'</span></div>' : '')
      + refund
      + '</section>'
    : '<section class="card panel"><h2>'+y+'年分の納付スケジュール</h2>'
      + '<div class="hint">'+y+'年分は、いまの記録では納める税金がありません。'
      + '収入を記録すると、納める時期と金額がここに並びます。</div></section>';

  const monthlyCard = monthly.length
    ? '<section class="card panel"><h2>毎月かかるもの</h2>'
      + monthly.map(o=>'<div class="trow"><span class="tlab">'+o.label
        + (o.note?'<small>'+o.note+'</small>':'')+'</span>'
        + '<span class="tval">'+yen(o.amount)+'<small style="font-weight:400;color:var(--muted)"> /月</small></span></div>').join('')
      + '<div class="trow total"><span class="tlab">毎月の合計</span><span class="tval">'+yen(monthlySum)+'</span></div>'
      + '</section>'
    : '';

  /* ---- 積立の進捗 ---- */
  const bal = savedBalance();
  const target = t.all;
  const pct = target>0 ? Math.min(100, Math.round(bal/target*100)) : 0;
  const short = Math.max(0, target-bal);
  const monthsLeft = Math.max(1, Math.round((new Date(y+1,2,15) - NOW)/86400000/30.4));
  const perMonth = Math.ceil(short/monthsLeft/1000)*1000;
  const list = state.saves.slice().sort((a,b)=> b.y-a.y || b.m-a.m || b.d-a.d).slice(0,12)
    .map(v=>'<div class="item"><div class="item-main">'
      + '<span class="item-name">'+(v.amount<0?'引き出し':'積立')+'</span>'
      + '<span class="item-sub">'+v.y+'/'+v.m+'/'+v.d+(v.note?'　'+esc(v.note):'')+'</span></div>'
      + '<span class="amt">'+(v.amount<0?'−':'＋')+yen(Math.abs(v.amount))+'</span>'
      + '<span class="item-actions">'
      + '<button type="button" class="icon-btn" data-act="editsave" data-id="'+v.id+'">編集</button>'
      + (view.pendingDelete===v.id
        ? '<button type="button" class="icon-btn del confirm" data-act="savedel2" data-id="'+v.id+'">本当に削除？</button>'
        : '<button type="button" class="icon-btn del" data-act="savedel" data-id="'+v.id+'">削除</button>')
      + '</span></div>').join('');

  const saveCard =
    '<section class="card panel">'
    + '<div class="panel-head"><h2>納税用の積立</h2><div class="actions">'
    + '<button class="btn-sm" data-act="addsave">＋ 積立を記録</button></div></div>'
    + (target>0
      ? '<div class="prog-num">'+yen(bal)+'<small>　／　目標 '+yen(target)+'</small></div>'
        + '<div class="prog"><span style="width:'+pct+'%"></span></div>'
        + '<div class="sum-row" style="margin-top:10px">'
        + (short>0
          ? '<span>あと<b>'+yen(short)+'</b></span>'
            + '<span>'+(y+1)+'年3月まで月<b>'+yen(perMonth)+'</b></span>'
          : '<span><b>目標に届いています。</b></span>')
        + '</div>'
        + '<div class="hint" style="margin-top:10px">目標は'+y+'年分の税金と社会保険の合計 '+yen(target)+' です。'
        + '別口座によけた額を記録すると、いまいくら足りないかが分かります。</div>'
      : '<div class="hint">'+y+'年の収入を記録すると、目標額が決まります。</div>')
    + (list ? '<div class="group-label" style="margin-top:16px">記録</div>'+list : '')
    + '</section>';

  return schedCard + monthlyCard + saveCard;
}

function nextInvoiceNo(){
  const y = NOW.getFullYear();
  const n = state.invoices.filter(v=>v.no.indexOf(y+'-')===0).length + 1;
  return y+'-'+String(n).padStart(3,'0');
}
/* 締め日と入金条件から入金予定日を出す */
function guessDue(dateS){
  const pr = state.profile;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateS||'');
  if(!m || !pr.payDay) return '';
  let y = +m[1], mo = +m[2];
  const d = +m[3];
  /* 締め日を過ぎていたら翌月締め扱い */
  if(pr.closingDay && d > pr.closingDay) mo += 1;
  mo += pr.payMonths;
  while(mo>12){ mo -= 12; y += 1; }
  const day = Math.min(pr.payDay, daysInMonth(y,mo));
  return y+'-'+pad2(mo)+'-'+pad2(day);
}

/* ---------- 決算書・収支内訳書の数字 ----------
   記録した収支と家事按分を、申告書に書く科目ごとにまとめる。
   棚卸と減価償却はこのアプリで扱っていないので、そのぶんは注記で伝える。 */
function statement(y){
  const inRows = [
    {label:'売上（収入）金額', amount: state.biz.filter(b=>b.y===y&&b.type==='in'&&b.cat==='sales')
      .reduce((s,b)=>s+b.amount,0)},
    {label:'雑収入', amount: state.biz.filter(b=>b.y===y&&b.type==='in'&&b.cat==='inother')
      .reduce((s,b)=>s+b.amount,0)}
  ];
  const income = inRows.reduce((s,r)=>s+r.amount,0);

  const cost = state.biz.filter(b=>b.y===y&&b.type==='ex'&&b.cat==='buy')
    .reduce((s,b)=>s+b.amount,0);

  /* 経費は決算書の科目名にまとめる。家事按分も同じ科目に合流させる */
  const exp = new Map();
  const bump = (acc, amt, from)=>{
    if(amt<=0) return;
    const o = exp.get(acc) || {acc, amount:0, ap:0};
    o.amount += amt;
    if(from==='ap') o.ap += amt;
    exp.set(acc, o);
  };
  state.biz.filter(b=>b.y===y && b.type==='ex' && b.cat!=='buy')
    .forEach(b=>bump(ACC_EX[b.cat] || '雑費', b.amount, 'rec'));
  for(let m=1;m<=12;m++){
    state.payments.filter(p=>p.bizPct>0 && occursIn(p,y,m)).forEach(p=>{
      bump(ACC_FIX[p.cat] || '雑費', Math.round(p.amount*p.bizPct/100), 'ap');
    });
  }
  const expRows = [...exp.values()].sort((a,b)=>b.amount-a.amount);
  const expTotal = expRows.reduce((s,r)=>s+r.amount,0);

  const gross = income - cost;
  const diff = gross - expTotal;
  const blueMax = state.profile.filing==='blue65' ? 650000
    : state.profile.filing==='blue10' ? 100000 : 0;
  const blue = Math.min(blueMax, Math.max(0, diff));
  return {inRows, income, cost, expRows, expTotal, gross, diff, blue,
    net: diff - blue, hasCost: cost>0};
}

  const expHtml = st.expRows.map(r=>

    + (r.ap>0 ? '<br><span class="sub-note">うち家事按分 '+yen(r.ap)+'</span>' : '')

    + '<div class="panel-head"><h2>'+y+'年の'+filingLabel+'</h2><div class="actions">'
    + (dl ? '<button class="btn-sm" data-act="stmtcsv">CSVで書き出す</button>' : '')

    + '経費は申告書の科目名に置きかえてあります。</div>'
    + '<table class="ytable" style="margin-top:14px"><tbody>'
    + '<tr class="sec"><td colspan="2">収入</td></tr>'
    + st.inRows.filter(r=>r.amount>0).map(r=>row(r.label, r.amount)).join('')
    + row('収入計', st.income, 'sum')
    + (st.hasCost
      ? '<tr class="sec"><td colspan="2">売上原価</td></tr>'

      : '')
    + '<tr class="sec"><td colspan="2">経費</td></tr>'
    + expHtml

    + row('差引金額（収入 − 原価 − 経費）', st.diff)
    + (st.blue>0 ? row('青色申告特別控除', st.blue) : '')
    + row('所得金額', st.net, 'sum')
    + '</tbody></table>'
    + '<div class="notice" style="margin-top:16px">この集計に<b>入っていないもの</b>があります。'
    + '<br>・<b>減価償却費</b>：10万円以上の道具や車両を買った場合、その年に全額を経費にできないことがあります'

    + (st.hasCost ? '<br>・<b>期首・期末の棚卸</b>：売上原価は「仕入金額」だけで計算しています。在庫がある場合は調整が必要です。' : '')

    + '</section>';

function exportStatementCsv(){
  if(!dl) return;
  const y = view.y;
  const st = statement(y);
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const rows = [['区分','科目','金額']];
  st.inRows.filter(r=>r.amount>0).forEach(r=>rows.push(['収入', r.label, r.amount]));
  rows.push(['収入', '収入計', st.income]);
  if(st.hasCost){
    rows.push(['売上原価', '仕入金額', st.cost]);
    rows.push(['売上原価', '差引金額', st.gross]);
  }
  st.expRows.forEach(r=>rows.push(['経費', r.acc, r.amount]));
  rows.push(['経費', '経費計', st.expTotal]);
  rows.push(['まとめ', '差引金額', st.diff]);
  if(st.blue>0) rows.push(['まとめ', '青色申告特別控除', st.blue]);
  rows.push(['まとめ', '所得金額', st.net]);
  const csv = '\uFEFF' + rows.map(r=>r.map(q).join(',')).join('\r\n');
  dl.save({filename:'sonae-kessansho-'+y+'.csv', data:csv})
    .then(()=>toast(y+'年の決算書の数字を書き出しました'))
    .catch(err=>{ if(err && err.code!=='declined') toast('書き出せませんでした'); });
}

          +(t.nhiCfg.std?'・実際の料率は市区町村ごとに異なります':'')

    + '<div class="next-line">'
    + (t.needFiling

    + '<section class="card panel"><h2>内訳</h2>'

    + trow('給与所得', yen(t.salIncome), '給与収入 '+yen(t.sal)+' − 給与所得控除')
    + trow('追加の所得税（復興特別所得税込み）', yen(t.addIT), '給与に副業所得を合算したときの増加分')
    + trow('追加の住民税', yen(t.addRT), '副業所得 × 10%')
    + '<div class="trow total"><span class="tlab">副業による追加負担の合計</span><span class="tval">'+yen(t.taxTotal)+'</span></div>'
    + '</section>'
    + tipsTeaser(t, view.y)

function nhiCityOptions(prefId, sel){
  const pref = NHI_PREF_MAP[prefId] || NHI_PREF_MAP.tokyo;
  const opt = (v,l)=>'<option value="'+v+'"'+(sel===v?' selected':'')+'>'+l+'</option>';
  let out = '';
  if(prefId==='tokyo') out += opt('tokyostd','東京23区（標準的な区）');
  const cities = Object.keys(NHI_PRESETS)
    .filter(k=>k!=='tokyostd' && NHI_PRESETS[k].pref===prefId);
  out += cities.map(k=>opt(k, NHI_PRESETS[k].label)).join('');
  const hasAbove = prefId==='tokyo' || cities.length>0;
  if(pref.std) out += opt('std', (hasAbove?'上記以外の':'県内の')+'市区町村（都道府県の標準料率で概算）');
  out += opt('custom','料率を自分で入力');
  return out;
}

/* ---------- 節税のヒント ----------
   「あと1円ぶん」の限界税率を出し、そこから効果額を見積もる。
   経費（＝所得そのものを減らす）は所得税・住民税・個人事業税・国保に効くが、
   小規模企業共済やiDeCoのような所得控除は所得税・住民税にしか効かない。 */
function marginalRates(t){
  const pr = state.profile;
  const rateAt = taxable=>{
    if(taxable<=0) return 0;
    for(const [lim,r] of TAX.brackets) if(taxable<=lim) return r*1.021;
    return 0;
  };
  if(t.mode==='side'){
    const r = rateAt(t.sideTaxable) + (t.sideProfit>0 ? TAX.residentRate : 0);
    return {it:rateAt(t.sideTaxable), rt:TAX.residentRate, bt:0, nhi:0, expense:r, deduction:r};
  }
  const itR = rateAt(t.itTaxable);
  const rtR = t.rtTaxable>0 ? TAX.residentRate : 0;
  const btR = (pr.bizTaxRate>0 && t.profit>TAX.bizTaxExempt) ? pr.bizTaxRate/100 : 0;
  let nhiR = 0;
  if(pr.hiType==='nhi'){
    const c = nhiConfig(pr).comps;
    const nb = Math.max(0, t.income - TAX.nhiBase);
    /* 賦課限度額に達している区分は、所得が減っても保険料が変わらない */
    const mr = (comp, members)=>
      (comp && comp.r>0 && (nb*comp.r/100 + comp.k*members + comp.h) < comp.cap) ? comp.r/100 : 0;
    if(nb>0){
      nhiR = mr(c.med, pr.nhiMembers) + mr(c.sup, pr.nhiMembers)
        + (c.kid ? mr(c.kid, pr.nhiMembers) : 0)
        + (pr.care40 ? mr(c.care, 1) : 0);
    }
  }
  return {it:itR, rt:rtR, bt:btR, nhi:nhiR,
    expense: itR+rtR+btR+nhiR, deduction: itR+rtR};
}

      save: gain*(mg.it+mg.rt+mg.nhi), hot:true,
      b:'いまは'+(pr.filing==='blue10'?'青色申告（10万円控除）':'白色申告')+'の設定です。'
        +'複式簿記で記帳してe-Taxで申告すると<b>65万円</b>（e-Taxを使わないなら55万円）を所得から引けます。'
        +'赤字を3年繰り越せる、30万円未満の道具を一括で経費にできる、家族への給与を経費にできる、'
        +'といった特典もまとめて付いてきます。会計ソフトを使えば複式簿記の負担はほとんどありません。',
      when:'「所得税の青色申告承認申請書」を '+aoY+'年3月15日までに税務署へ（'+aoY+'年分から適用）'});
  }

  /* ── 家事按分 ── */
  if(t.ap===0){
    tips.push({t:'自宅や車の費用を按分して経費にする', dep:'expense',
      save: 120000*mg.expense, hot:true,
      b:'家賃・電気・水道・スマホ・ネット・車の維持費は、仕事に使っている割合だけ経費にできます。'
        +'自宅の一室を仕事場にしている、私用と兼用の車で移動している、'
        +'といった<b>「私生活と共用しているもの」</b>がねらい目です。'
        +(state.payments.length
          ? '「支払い」に登録済みの固定費を開いて<b>経費にする割合</b>を決めると、ここに自動で反映されます。'
          : 'まず「支払い」に家賃や光熱費を登録し、<b>経費にする割合</b>を決めてください。')
        +'割合は面積や使用時間など、あとで説明できる根拠で決めます。'});
  }

  /* ── 少額減価償却資産 ── */
  if(pr.filing!=='white' && t.profit>0){
    tips.push({t:'30万円未満の道具は買った年に全額経費', dep:'expense',
      save: 0,
      b:'青色申告なら<b>1個30万円未満</b>の工具・機械・車両などを、買った年に全額経費にできます（年間300万円まで）。'
        +'白色だと10万円以上は数年に分けて経費にするので、同じ買い物でもその年に落とせる額が変わります。'
        +'機械・車両・パソコン・カメラ・厨房機器など、買い替えの時期が近いものは'
        +'年内に前倒しすると、その年の利益を圧縮できます。'
        +'なおこの特例には<b>適用期限</b>があり、これまで延長が繰り返されてきました。'
        +'年をまたぐ買い物のときは、そのときの期限を確認してください。',
      when:'12月31日までに買って、<b>実際に使い始めている</b>ことが条件です'});
  }else if(pr.filing==='white' && t.profit>0){
    tips.push({t:'10万円以上の道具は一度に経費にできない', dep:null, save:0,
      b:'白色申告では、10万円以上の工具や車両は数年に分けて経費にします（減価償却）。'
        +'青色申告にすると30万円未満は買った年に全額落とせるので、道具の買い替えが多い年ほど差が出ます。'});
  }

  /* ── 小規模企業共済 ── */
  if(t.profit>0){
    const dd = pr.ded;
    const kRoom = Math.max(0, 840000 - dd.kyosai);
    if(kRoom>0){
      tips.push({t: dd.kyosai>0 ? '小規模企業共済を増額する' : '小規模企業共済（個人事業主の退職金）',
        dep:'deduction', save: kRoom*mg.deduction,
        b:(dd.kyosai>0
            ? 'いま年 '+yen(dd.kyosai)+'（月 '+yen(Math.round(dd.kyosai/12))+'）を掛けています。'
              +'上限は月7万円・年84万円なので、<b>あと年 '+yen(kRoom)+'</b> 増やせます。'

          +(mg.deduction>0 && !dd.kyosai
            ? '月1万円（年12万円）なら約'+yen(Math.round(120000*mg.deduction/100)*100)+'、'

    }
    const iCap = dd.nenkinKikin>0 ? 804000 : 816000;
    const iRoom = Math.max(0, iCap - dd.ideco - dd.nenkinKikin);
    if(iRoom>0){
      tips.push({t: dd.ideco>0 ? 'iDeCoを増額する' : 'iDeCo（個人型確定拠出年金）',
        dep:'deduction', save: iRoom*mg.deduction,
        b:(dd.ideco>0
            ? 'いま年 '+yen(dd.ideco)+' を掛けています。個人事業主の枠は月68,000円までなので、'

      +'受け取り始めて<b>2年で元が取れる</b>計算で、掛金も全額が社会保険料控除になります。'

  /* ── 国民年金の前納 ── */

      +'まとめて払った分は、払った年に全額を控除するか、各年に分けて控除するかを選べます。',

  /* ── 保険料の免除・軽減（所得が低いとき） ── */
  if(t.income <= 1680000){
    tips.push({t:'国民年金の免除・納付猶予を申請できるかも', dep:null,
      save: t.income<=670000 ? t.pension : 0, saveWord:'最大 年 約', hot:t.income<=670000,
      b:'所得が一定以下だと、国民年金の保険料が全額または一部免除されます。'

        +'免除された期間も年金の受給資格期間に入り、全額免除でも将来の年金の<b>2分の1は受け取れます</b>。'
