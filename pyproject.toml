[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-meo"
version = "0.1.0"
description = "辰弥塗装工業のSEO/MEOデータ収集・レポート基盤"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seo-meo = "seo_meo.cli:main"

[tool.setuptools.packages.find]
include = ["seo_meo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
