<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="屋根施工前 写真のプレースホルダ">
  <rect width="800" height="600" fill="#e8eaec"/>
  <g fill="none" stroke="#b9c0c8" stroke-width="2" stroke-dasharray="10 8">
    <rect x="24" y="24" width="752" height="552" rx="10"/>
  </g>
  <text x="400" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#8a949e">屋根</text>
  <text x="400" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#5a6674">施工前</text>
  <text x="400" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#8a949e">実際の写真に差し替えてください</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#8a949e">前後は同じ位置・同じ角度で撮ると効果的です</text>
</svg>
