# 会社情報。
#
# ここに書いた社名・住所・電話番号は、サイト表示と構造化データ (JSON-LD) の
# 両方に使われます。**Google ビジネスプロフィールの登録内容と一字一句そろえて
# ください。**「1-2-3」と「一丁目2番3号」のような表記ゆれでも、Google からは
# 別の情報に見えます (NAP のズレ) 。これは MEO の減点要因です。
#
# 【要記入】が残っているとビルド時に警告が出ます。

[company]
name = "辰弥塗装工業"
legal_name = "辰弥塗装工業"
tagline = "住まいを、次の20年へ。"
description = "外壁塗装・屋根塗装を専門に手がけています。現地調査とお見積りは無料。塗料の製品名と工程まで明記したお見積りをお出しします。"

postal_code = "【要記入】000-0000"
prefecture = "【要記入】〇〇県"
city = "【要記入】〇〇市"
street_address = "【要記入】〇〇町1-2-3"

phone = "【要記入】000-000-0000"
email = ""

representative = "【要記入】代表者名"
established = "【要記入】0000年"

# 建設業許可を取得している場合に記入。無い場合は空文字にしてください
# (許可番号は、あるように見せかけると法令上の問題になります)。
license_number = "【要記入】〇〇県知事許可（般-00）第00000号"

# 表示用の営業時間。自由に書けます。
business_hours = "【要記入】8:00〜18:00"
holidays = "【要記入】日曜・祝日"

# 構造化データ用の機械可読な営業時間。表示用とは別に必要です。
# 例: ["Mo-Fr 08:00-18:00", "Sa 08:00-17:00"]
opening_hours_spec = ["【要記入】Mo-Sa 08:00-18:00"]

# 価格帯の目安。¥ の数で表します (¥ = 安い 〜 ¥¥¥¥ = 高い)。
price_range = "¥¥"

# 対応エリア。市区町村名で書いてください。構造化データの areaServed と
# フッター・トップページの表示に使われます。
areas = ["【要記入】〇〇市", "【要記入】〇〇市", "【要記入】〇〇町"]

# Google ビジネスプロフィールの公開URL。構造化データの sameAs に入ります。
gbp_url = ""

# Googleマップの埋め込みURL (マップの「共有」→「地図を埋め込む」の src の値)。
# 空にすると問い合わせページに地図が出ません。
map_embed_url = ""
