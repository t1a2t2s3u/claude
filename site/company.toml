# 会社情報。
#
# ここに書いた社名・住所・電話番号は、サイト表示と構造化データ (JSON-LD) の
# 両方に使われます。**Google ビジネスプロフィールの登録内容と一字一句そろえて
# ください。**「1-2-3」と「一丁目2番3号」のような表記ゆれでも、Google からは
# 別の情報に見えます (NAP のズレ) 。これは MEO の減点要因です。
#
# 以下の値は、2026年8月時点の GBP の登録内容から転記しています。
# GBP 側を変更したときは、ここも合わせて直してください。
#
# 【要記入】が残っているとビルド時に警告が出ます。

[company]
name = "辰弥塗装工業"
legal_name = "辰弥塗装工業"
tagline = "秋田の家を、雪と潮風から守る。"
description = "秋田市を中心に、外壁塗装・屋根塗装・住宅リフォーム塗装を手がけています。秋田の雪・湿気・塩害に合わせて塗料を選び、現地調査と診断のうえで工法をご提案します。現地調査とお見積りは無料です。"

# GBP 登録：〒0110931 秋田県 秋田市将軍野東2丁目15-60-5
postal_code = "011-0931"
prefecture = "秋田県"
city = "秋田市"
street_address = "将軍野東2丁目15-60-5"

phone = "080-7706-5395"
email = ""

representative = "浅利辰也"

# 表示用の創業年と、構造化データ用の開業日 (GBP の登録：2021年4月1日)
established = "2021年"
founded_on = "2021-04-01"

# 建設業許可は未取得。空のままにしておくこと。
# 一般的な住宅の塗り替え (1件500万円未満) は「軽微な建設工事」にあたり、
# 建設業法上、許可がなくても適法に施工できる。持っていない許可を
# あるように見せるのは法令違反になるため、絶対に埋めない。
license_number = ""

# 表示用の営業時間。GBP の登録：月〜金 8:00-20:00 / 土 8:30-19:00 / 日 定休
business_hours = "平日 8:00〜20:00／土曜 8:30〜19:00"
holidays = "日曜"

# 構造化データ用の機械可読な営業時間。表示用とは別に必要です。
opening_hours_spec = ["Mo-Fr 08:00-20:00", "Sa 08:30-19:00"]

# 価格帯の目安。¥ の数で表します (¥ = 安い 〜 ¥¥¥¥ = 高い)。
price_range = "¥¥"

# 対応エリア。GBP の「サービス提供地域」は現在「秋田市」のみ。
# 近隣市町村も対応するなら、GBP 側に追加したうえでここにも足してください。
areas = ["秋田市"]

# トップページに並べる信頼材料。建設業許可がない分、ここで具体的な事実を出す。
# 事実でないことは書かないこと。
trust_points = [
  "一級塗装技能士が施工",
  "完全自社施工",
  "保証 最大5年",
  "無料診断・お見積り",
]

# 保有資格。建設業許可がない分、ここが技術力の裏づけになる。
# 実際に保有しているものだけを書くこと。
qualifications = ["一級塗装技能士（在籍）", "有機溶剤作業主任者"]

# Google ビジネスプロフィールの公開URL。構造化データの sameAs に入ります。
# プロフィール画面の「プロフィールを共有」から取得できます。
gbp_url = ""

instagram_url = "https://www.instagram.com/tatsumi_tosou_kougyou/"

# LINE公式アカウントのURL。チラシのQRコードと同じ宛先を入れてください。
# LINE Official Account Manager の「友だち追加」から取得できます。
line_url = ""

# Googleマップの埋め込みURL (マップの「共有」→「地図を埋め込む」の src の値)。
# 空にすると問い合わせページに地図が出ません。
map_embed_url = ""
