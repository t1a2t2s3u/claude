[[service]]
slug = "gaiheki"
name = "外壁塗装"
summary = "足場設置から高圧洗浄、下地補修、下塗り・中塗り・上塗りまで。建物の状態に合わせて塗料を選びます。"
price_from = "【要記入】00万円〜"
price_note = "（30坪程度の戸建ての場合）"
duration = "10〜14日"
features = [
  "高圧洗浄で旧塗膜と汚れを落としてから施工します",
  "ひび割れ（クラック）やコーキングの劣化は下地補修で対応します",
  "下塗り・中塗り・上塗りの3回塗りが基本です",
  "お見積りには塗料のメーカー名と製品名を明記します",
]
body = """
外壁の塗装は、見た目を整えるだけの工事ではありません。塗膜が切れた外壁は
雨水を吸い、内部の下地や断熱材まで傷みます。そこまで進むと、塗装ではなく
張り替えになり、費用は一桁変わります。

そのため当社では、現地調査で**塗装で足りるのか、補修が先に必要なのか**を
先に判断してからお見積りをお出ししています。
"""

