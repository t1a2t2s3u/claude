# 対応する工事と、パック料金。
#
# 料金は工事ごとではなく「塗料のグレード別のパック料金」で決まる。
# 2026年8月のチラシ (a454e316-2_tatuya_A4S_OL.pdf) の内容を転記している。
# チラシを刷り直したら、ここも合わせて直すこと。

# ---------------------------------------------------------------
# パック料金の前提。金額だけを出すと誤解を招くので必ず一緒に表示する。
# ---------------------------------------------------------------
[package_plan]
basis = "30坪程度の戸建ての場合"
warranty = "最大5年"

# 消費税の総額表示 (消費税法第63条)。チラシの金額は税込であることを確認済み。
tax_note = "表示価格はすべて税込です。"

includes = [
  "足場の設置・解体",
  "高圧洗浄",
  "シーリング（コーキング）工事",
  "外壁塗装",
  "屋根塗装",
  "付帯部塗装",
]

# 契約者特典は現在実施していないため、記載しない。
# 再開するときは bonus と bonus_options を設定すれば表示される。

# ---------------------------------------------------------------
# 塗料グレード別の料金。耐久年数の長い順ではなく、安い順に並べる。
# ---------------------------------------------------------------
[[package]]
name = "シリコン塗料"
durability = "約7年"
price = "84万円"

[[package]]
name = "ラジカル制御型塗料"
durability = "約10年"
price = "90万円"

[[package]]
name = "フッ素塗料"
durability = "約15年"
price = "109万円"

[[package]]
name = "遮熱塗料"
durability = "約15年"
price = "114万円"
note = "夏の室温上昇を抑えたい方に"

[[package]]
name = "無機塗料"
durability = "約20年"
price = "116万円"

# ---------------------------------------------------------------
# 工事の内容。料金は上のパックに含まれるため、ここには書かない。
# ---------------------------------------------------------------
[[service]]
slug = "gaiheki"
name = "外壁塗装"
summary = "高圧洗浄、下地補修、下塗り・中塗り・上塗りまで。建物の状態と秋田の気候に合わせて塗料を選びます。"
duration = "10〜14日"
in_package = true
image = "works/shokunin-gaiheki.jpg"
# 写っているのは代表本人。小さな会社では「代表が自ら現場に立つ」ことが
# そのまま信頼材料になるので、誰かが伝わるように説明を添える。
image_caption = "外壁の塗装作業（代表・浅利辰也）"
features = [
  "高圧洗浄で旧塗膜と汚れを落としてから施工します",
  "ひび割れ（クラック）は下地補修で対応します",
  "下塗り・中塗り・上塗りの3回塗りが基本です",
  "お見積りには塗料のメーカー名と製品名を明記します",
]
body = """
外壁の塗装は、見た目を整えるだけの工事ではありません。塗膜が切れた外壁は
雨水を吸い、内部の下地や断熱材まで傷みます。そこまで進むと、塗装ではなく
張り替えになり、費用は一桁変わります。

秋田は雪と湿気の影響が大きく、本州の温暖な地域と同じ感覚では判断できません。
現地調査では**塗装で足りるのか、補修が先に必要なのか**を見極めたうえで
お見積りをお出しします。
"""

[[service]]
slug = "yane"
name = "屋根塗装"
summary = "スレート・トタン・セメント瓦の塗り替えに対応。パック料金には屋根塗装も含まれます。"
duration = "7〜10日"
in_package = true
features = [
  "外壁と同じ足場を使うため、パック料金に含めています",
  "スレート屋根は縁切りを行い、雨水の逃げ道を確保します",
  "傷みが激しい場合は、塗装ではなくカバー工法をご提案することがあります",
]
body = """
屋根は地上から見えないため、傷んでいることに気づきにくい場所です。
外壁より紫外線・雪・雨を強く受けるので、傷みは外壁より早く進みます。

足場は外壁と屋根で共通です。別々に工事すると足場代を2回払うことになるため、
**当社のパック料金は最初から外壁と屋根の両方を含めています。**
"""

[[service]]
slug = "coking"
name = "コーキング（シーリング）工事"
summary = "サイディングの目地やサッシまわりの充填材の打ち替え。パック料金に含まれます。"
duration = "2〜4日"
in_package = true
features = [
  "古いコーキングを撤去してから充填する「打ち替え」が基本です",
  "状態が良い箇所に限り「増し打ち」で対応します",
  "パック料金に含まれるため、追加費用はかかりません",
]
body = """
サイディング外壁の板と板の間にあるゴム状の部分がコーキングです。
ここは外壁材より先に劣化し、**切れると雨水がまっすぐ内部に入ります**。

築10年前後で硬化・ひび割れが出ることが多く、外壁塗装と同時に打ち替えるのが
一般的です。当社ではパック料金に含めているため、後から別請求になることは
ありません。
"""

[[service]]
slug = "bousui"
name = "防水工事"
summary = "ベランダ・屋上の防水層の劣化に対応。パック料金とは別に、状態を見てお見積りします。"
duration = "3〜7日"
in_package = false
price_from = "別途お見積り"
price_note = "（面積と工法により変動します）"
features = [
  "ウレタン防水・シート防水など、下地の状態に合わせて選定します",
  "雨漏りが出ている場合は、原因箇所の特定から行います",
  "トップコートの塗り替えのみで足りる場合はその旨をお伝えします",
]
body = """
ベランダや屋上の床がひび割れていたり、水たまりが残るようになったら、
防水層が寿命を迎えているサインです。

雨漏りは「漏れている場所」と「入っている場所」が違うことがよくあります。
**原因を特定せずに防水工事だけをしても止まらない**ため、まず調査から
お受けしています。
"""
