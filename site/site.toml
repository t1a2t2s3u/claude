# サイト全体の設定。

[site]
name = "辰弥塗装工業"

# 公開先のURL。canonical タグと sitemap.xml に使われます。末尾スラッシュ不要。
#
# www あり・なしの両方でサイトが見えると、Google からは別々のサイトに
# 見えて評価が分散します。ここに書いたほうを正とし、もう一方は
# 公開先の設定でこちらへ転送します。
base_url = "https://tatsumi-tosou.com"

description = "外壁塗装・屋根塗装の専門店。現地調査とお見積りは無料です。"
locale = "ja_JP"
contact_note = "現地調査・お見積りは無料です。ご相談だけでもお気軽にどうぞ。"

# ヘッダーのロゴ。社名まで入った横長のロゴなので、ヘッダーでは文字を重ねて
# 出さない (重複するため)。
logo = "logo.png"

# ホーム画面に追加したときのアイコン。ロゴのマーク部分だけの正方形。
mark = "mark.png"

# トップの見出しの背景に敷く写真。上に文字が乗るため、暗く重ねて表示する。
# 差し替えるときは、寄りすぎず・明暗差の少ない写真を選ぶこと。
hero_image = "works/tsuchizaki-yane-after.jpg"
