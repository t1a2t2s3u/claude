# セルフチェック（/shindan/）で出す劣化症状。
#
# 写真は site/assets/symptoms/ に置く。**すべてフリー素材なので、施工事例の
# ページには使えない。** チョーキングだけはブログ記事のカバーを流用している。
#
# level は進み具合。判定はこの数字だけで決まる。
#   1 = 初期。塗膜はまだ役目を果たしている
#   2 = 進行。塗膜が切れ始め、水の入り口ができつつある
#   3 = 水が入っている。放っておくと下地や構造材に及ぶ
#
# 症状を足すときは、写真と level を決めてここに追記すれば画面に出る。

[[symptom]]
slug = "chalking"
name = "チョーキング"
question = "壁を手でこすると、白い粉が付く"
image = "blog/20nen-chalking.jpg"
level = 1
note = "塗膜の防水の役目が終わったサインです。壁そのものはまだ守られています。"

[[symptom]]
slug = "crack-hosoi"
name = "細いひび割れ"
question = "髪の毛くらいの細いひびがある"
image = "symptoms/crack-hosoi.jpg"
level = 1
note = "塗膜の表面だけのひびです。この段階なら、塗装のときの下地補修で直せます。"

[[symptom]]
slug = "koke"
name = "北面の苔・藻"
question = "日の当たらない面に、緑や黒の汚れが出ている"
image = "symptoms/koke.jpg"
level = 1
note = "壁が乾かず、湿気を含んだままになっています。塗膜が水を弾かなくなった証拠です。"

[[symptom]]
slug = "coking-hibi"
name = "コーキングのひび"
question = "壁の継ぎ目（ゴム状の部分）に、細かいひびが入っている"
image = "symptoms/coking-hibi.jpg"
level = 1
note = "まだ中まで切れてはいません。この段階で打ち替えれば、水は入りません。"

[[symptom]]
slug = "crack-futoi"
name = "太いひび割れ"
question = "ひびが開いていて、中が見える"
image = "symptoms/crack-futoi.jpg"
level = 2
note = "塗膜を越えて壁本体まで達しています。雨のたびに水が入ります。"

[[symptom]]
slug = "fukure"
name = "塗膜の膨れ"
question = "壁の一部が浮いていて、押すとペコペコする"
image = "symptoms/fukure.jpg"
level = 2
note = "塗膜の裏に水が回っています。放っておくと、そこからはがれます。"

[[symptom]]
slug = "coking-kire"
name = "コーキングの切れ"
question = "継ぎ目が裂けて、奥が見えている"
image = "symptoms/coking-kire.jpg"
level = 3
note = "水がまっすぐ内部に入る状態です。外壁材の裏側が濡れ続けます。"

[[symptom]]
slug = "hagare"
name = "塗膜のはがれ"
question = "塗装がめくれて、下地がむき出しになっている"
image = "symptoms/hagare.jpg"
level = 3
note = "壁が直接、雨と紫外線を受けています。ここから急に傷みが進みます。"

[[symptom]]
slug = "touhai"
name = "凍害"
question = "壁の表面がボロボロと崩れ、欠けている"
image = "symptoms/touhai.jpg"
level = 3
note = "入った水が凍って膨らみ、壁そのものを押し割った状態です。秋田で多い傷み方です。"

# ---------------------------------------------------------------
# 判定。該当した症状のうち、いちばん重い level で決まる。
# 「まだ大丈夫」と言い切れない以上、どの判定でも断定はしない。
# ---------------------------------------------------------------
[[verdict]]
level = 0
title = "今のところ、急ぐ必要はなさそうです"
body = """
当てはまる症状はありませんでした。**今すぐ何かをする必要はなさそうです。**

ただし、**外から見えない場所が傷んでいることもあります。** 屋根、北側の壁、
2階の高いところは、地上からは確認できません。前回の塗装から10年以上経って
いるようでしたら、一度見ておくと安心です。
"""

[[verdict]]
level = 1
title = "塗り替えを考え始める時期です"
body = """
**今すぐ雨漏りする状態ではありません。** 慌てる必要はありません。

ただ、塗膜が役目を終えかけています。この段階で塗り替えれば、
**下地の補修がほとんど要らないぶん、費用は安く済みます。**
あと数年放っておくと、下の段階へ進みます。
"""

[[verdict]]
level = 2
title = "一度、見ておいたほうがよい状態です"
body = """
**水の入り口ができています。** まだ塗装で直せる段階ですが、
ここから先は進み方が早くなります。

秋田は**入った水が冬に凍って膨らむ**ので、本州の温暖な地域より早く進みます。
**雪が降る前に一度見ておく**ことをおすすめします。
"""

[[verdict]]
level = 3
title = "早めに見てもらってください"
body = """
**すでに水が入っています。** 塗装で直せるかどうかは、下地がどこまで傷んでいるかで
決まります。見てみないと分かりません。

脅かすつもりはありませんが、**ここから先は時間が費用に直結します。**
下地や構造材まで傷むと、塗装ではなく張り替えになり、費用は一桁変わります。
"""
