# お客様の声。
#
# 2026年8月のチラシ (a454e316-2_tatuya_A4S_OL.pdf 2枚目) に掲載されている、
# 実際にご契約いただいたお客様の声をそのまま転記している。
#
# 【重要】ここに書けるのは、実際にいただいた言葉だけ。創作した「お客様の声」
# を載せることは景品表示法上の問題になり得るうえ、Google からも評価されない。
#
# また、自社サイトに載せた自社への評価に Review / AggregateRating の構造化
# データを付けることは Google のガイドラインで認められていない。表示のみで、
# 構造化データには出さないこと。

[[testimonial]]
headline = "職人さんの技術が高く、丁寧な作業だった！"
body = "新築みたいに綺麗になって感動しました！色選びで迷いましたが、プロのアドバイスで理想通りの仕上がりになりました。職人さんの丁寧な仕事ぶりに感謝しています。隅々まで綺麗に仕上げてくれてありがとうございました。"

[[testimonial]]
headline = "近隣への挨拶や配慮も行き届いて安心でした！"
body = "ご近所さんの挨拶など、すごく丁寧で、職人さんたちも優しい人ばかりでした。アフターサービスも充実していて、何かあればすぐに対応してくれるので安心です。価格以上の仕上がりに大変満足しています。次回もぜひお願いしたいです。"

[[testimonial]]
headline = "相見積もりで比較しましたが、一番良心的な価格でした！"
body = "インターネットなど複数見積しましたが、ポスティングされている地元の辰弥塗装工業さんが一番安心で納得価格でした。インターネットの業者は地元ではないため、評判がわからず怖いイメージでしたので、長く地元で愛される業者さんをおすすめします！"
